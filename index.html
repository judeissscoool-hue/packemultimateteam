/* ================= CREDITS ECONOMY =================
   Earned only by playing — never purchasable. Rates are tuned for fast sessions:
   a draft takes ~2 minutes, so per-run payouts keep the core loop rewarding, while
   a soft daily cap on repeat runs stops mindless farming from trivialising the shop. */
const CREDITS_KEY="atu-credits-v1";
function emptyCredits(){return {bal:0,earned:0,day:null,runs:{draft:0,pack:0},log:[]};}
let CR=sGet(CREDITS_KEY)||emptyCredits();
/* heal anything malformed from an older/corrupt save so earning can never break */
if(!CR||typeof CR!=="object")CR=emptyCredits();
if(typeof CR.bal!=="number"||!isFinite(CR.bal))CR.bal=0;
if(typeof CR.earned!=="number"||!isFinite(CR.earned))CR.earned=0;
if(!CR.runs||typeof CR.runs!=="object")CR.runs={draft:0,pack:0};
if(typeof CR.runs.draft!=="number")CR.runs.draft=0;
if(typeof CR.runs.pack!=="number")CR.runs.pack=0;
if(!Array.isArray(CR.log))CR.log=[];
function saveCredits(){sSet(CREDITS_KEY,CR);}
function creditsRollDay(){ /* reset the per-day run counters at local midnight */
  const k=todayKey();
  if(CR.day!==k){CR.day=k;CR.runs={draft:0,pack:0};saveCredits();}
}
const CREDIT_RATES={
  draftRun:60, draftRunAfterCap:15, draftDailyCap:5,   /* full payout for the first 5 drafts a day */
  packRun:45,  packRunAfterCap:12, packDailyCap:5,
  daily:250, streakStep:30, streakMax:250,
  trophy:{Bronze:20,Silver:40,Gold:80,Diamond:150,Immortal:350},
  discovery:8,
  record:{70:150,75:300,80:600,82:1500}
};
function awardCredits(amount,reason){
  amount=Math.max(0,Math.round(amount));if(!amount)return 0;
  creditsRollDay();
  CR.bal+=amount;CR.earned+=amount;
  CR.log.unshift({n:amount,r:reason,t:Date.now()});CR.log=CR.log.slice(0,40);
  saveCredits();
  creditToast(amount,reason);
  return amount;
}
function creditToast(n,reason){
  if(typeof document==="undefined")return;
  const d=document.createElement("div");d.className="credittoast";
  d.innerHTML=`<b>+${n} CR</b><span>${esc(reason)}</span>`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),2600);
}
/* ---- earn hooks ---- */
function creditsForRun(kind){ /* kind: "draft" | "pack" */
  creditsRollDay();
  const cap=kind==="draft"?CREDIT_RATES.draftDailyCap:CREDIT_RATES.packDailyCap;
  const full=kind==="draft"?CREDIT_RATES.draftRun:CREDIT_RATES.packRun;
  const after=kind==="draft"?CREDIT_RATES.draftRunAfterCap:CREDIT_RATES.packRunAfterCap;
  const n=CR.runs[kind]||0;CR.runs[kind]=n+1;saveCredits();
  const amt=n<cap?full:after;
  awardCredits(amt,n<cap?(kind==="draft"?"Draft completed":"Squad locked in"):"Extra run today");
}
function creditsForTrophy(t){const v=CREDIT_RATES.trophy[t.tier]||20;awardCredits(v,t.tier+" trophy: "+t.n);}
function creditsForDiscovery(count){if(count>0)awardCredits(CREDIT_RATES.discovery*count,count+" new player"+(count>1?"s":"")+" discovered");}
function creditsForDaily(streak){
  const bonus=Math.min(CREDIT_RATES.streakMax,Math.max(0,(streak-1)*CREDIT_RATES.streakStep));
  awardCredits(CREDIT_RATES.daily+bonus,bonus?`Daily challenge (+${bonus} streak bonus)`:"Daily challenge");
}
function creditsForRecord(wins){
  creditsRollDay();
  T.creditRecords=T.creditRecords||{};
  /* award EVERY milestone newly crossed by this result, each one exactly once ever */
  [70,75,80,82].forEach(w=>{
    if(wins>=w&&!T.creditRecords[w]){
      T.creditRecords[w]=1;saveTrophies();
      awardCredits(CREDIT_RATES.record[w],w===82?"82–0 CLUB":w+"+ win season");
    }
  });
}

/* ================= COLLECTION =================
   Every card in the game, showing what you've discovered and what's still out there.
   Uses the permanent ledger (T.seenCards) so pulls from any mode count. */
let COLL_TIER="Icon", COLL_Q="", COLL_EFX="";
const COLL_TIERS=["Icon","Elite","Gold","Silver","Bronze"];
function collectionStats(){
  const total=DB.length;let seen=0;
  const byTier={};
  COLL_TIERS.forEach(t=>byTier[t]={seen:0,total:0});
  DB.forEach(p=>{
    const b=byTier[p.tier];if(!b)return;
    b.total++;
    if(T.seenCards[p.id]){b.seen++;seen++;}
  });
  return {seen,total,byTier};
}
/* browsing by tier and browsing by item are alternatives, so picking a tier
   drops the item filter rather than intersecting into a confusing empty grid */
function collSetTier(t){COLL_TIER=t;COLL_EFX="";render();}
function collSetEfx(v){COLL_EFX=v||"";render();}
/* effect id -> how many cards carry it, read off the "cardId|efxId" ledger */
function efxOwnedIndex(){
  const m={};
  for(const k in EFX.owned){
    const i=k.indexOf("|"); if(i<0)continue;
    const id=k.slice(i+1); if(!EFX_BY_ID[id])continue;
    m[id]=(m[id]||0)+1;
  }
  return m;
}
function cardsWithEfx(efxId){
  const out=[],seen={};
  for(const k in EFX.owned){
    const i=k.indexOf("|"); if(i<0||k.slice(i+1)!==efxId)continue;
    const cid=k.slice(0,i); if(seen[cid])continue; seen[cid]=1;
    const p=DB[+cid]; if(p)out.push(p);
  }
  return out;
}
function collEfxOptions(){
  const idx=efxOwnedIndex();
  const kinds=["frame","aura","sheen","energy","overlay"];
  let body="";
  kinds.forEach(k=>{
    const list=EFFECTS.filter(e=>e.k===k&&idx[e.id]);
    if(!list.length)return;
    body+=`<optgroup label="${EFX_SLOT_LABEL[k]}">`+list.map(e=>
      `<option value="${e.id}"${COLL_EFX===e.id?" selected":""}>${esc(e.n)} \u00b7 ${idx[e.id]} card${idx[e.id]===1?"":"s"}</option>`
    ).join("")+`</optgroup>`;
  });
  if(!body)return `<option value="">No items yet \u2014 open a Rafters pack</option>`;
  return `<option value="">Filter by item\u2026</option>`+body;
}
function collSearch(v){COLL_Q=(v||"").trim().toLowerCase();renderCollGrid();}
function collMatches(p){
  if(!COLL_Q)return true;
  return p.name.toLowerCase().includes(COLL_Q)||p.team.toLowerCase().includes(COLL_Q)||String(p.ovr).includes(COLL_Q);
}
function collTile(p){
  const got=!!T.seenCards[p.id];
  if(!got){
    return `<div class="ctile locked" title="Undiscovered">
      <div class="ct-q">?</div>
      <div class="ct-meta"><b>\u2014\u2014\u2014</b><span>${esc(p.tier.toUpperCase())}</span></div></div>`;
  }
  const art=cardArtURL(p);
  return `<div class="ctile t-${p.tier}" onclick="${efxEligible(p)?`openEquip(${p.id})`:`openCardZoom(event,${p.id})`}">
    ${art?`<img class="ct-art" src="${art}" ${cardArtFallbackAttr(p)} alt="">`:""}
    <div class="ct-ovr">${p.ovr}</div>
    <div class="ct-meta"><b>${esc(p.name)}</b><span>${esc(p.team)} \u00b7 ${esc(p.era)}</span></div></div>`;
}
function collPool(){
  /* item filter spans every tier \u2014 an item you own may sit on a Gold and an Icon */
  if(COLL_EFX&&EFX_BY_ID[COLL_EFX])
    return cardsWithEfx(COLL_EFX).filter(collMatches)
      .sort((a,b)=>COLL_TIERS.indexOf(a.tier)-COLL_TIERS.indexOf(b.tier)
                 ||b.ovr-a.ovr||a.name.localeCompare(b.name));
  return DB.filter(p=>p.tier===COLL_TIER&&collMatches(p))
           .sort((a,b)=>b.ovr-a.ovr||a.name.localeCompare(b.name));
}
function renderCollGrid(){
  const el=$("#collgrid");if(!el)return;
  const pool=collPool(),item=COLL_EFX&&EFX_BY_ID[COLL_EFX];
  const empty=item?(COLL_Q?"No card carrying "+esc(item.n)+" matches that search.":"No cards carry that item yet.")
                  :"No cards match that search.";
  el.innerHTML=pool.length?pool.map(collTile).join(""):`<div class="cempty">${empty}</div>`;
  const cnt=$("#collcount");
  if(cnt){
    if(item)cnt.textContent=pool.length+" card"+(pool.length===1?"":"s")+" carrying "+item.n.toUpperCase();
    else{const got=pool.filter(p=>T.seenCards[p.id]).length;cnt.textContent=got+" / "+pool.length+" found";}
  }
}
function collectionHTML(){
  const st=collectionStats();
  const pct=st.total?Math.round(st.seen/st.total*100):0;
  return `
  <div class="collhero">
    <div><h2>Collection</h2>
      <p>Every card in the game. Pull them in packs, draft them, or find them in the daily \u2014 discoveries are permanent.</p></div>
    <div class="collbig">${st.seen}<small>OF ${st.total} FOUND</small></div>
  </div>
  <div class="collbar"><i style="width:${pct}%"></i></div>
  <div class="colltabs${COLL_EFX?" dim":""}">
    ${COLL_TIERS.map(t=>{const b=st.byTier[t];
      return `<button class="ctab ${!COLL_EFX&&t===COLL_TIER?"on":""} ct-${t}" onclick="collSetTier('${t}')">
        ${t}<span>${b.seen}/${b.total}</span></button>`;}).join("")}
  </div>
  <div class="collfilters">
    <input class="collsearch" type="search" placeholder="Search name, team or OVR\u2026" value="${esc(COLL_Q)}"
      oninput="collSearch(this.value)" autocomplete="off">
    <select class="collefx${COLL_EFX?" on":""}" onchange="collSetEfx(this.value)"
      aria-label="Show only cards carrying an item">${collEfxOptions()}</select>
  </div>
  ${COLL_EFX&&EFX_BY_ID[COLL_EFX]?`<div class="collchip">
    <b>${esc(EFX_BY_ID[COLL_EFX].n)}</b>
    <span>${EFX_SLOT_LABEL[EFX_BY_ID[COLL_EFX].k]} \u00b7 every tier</span>
    <button onclick="collSetEfx('')" aria-label="Clear item filter">\u00d7</button></div>`:""}
  ${equipHTML()}
  <div class="collcount" id="collcount"></div>
  <div class="collgrid" id="collgrid"></div>
  <div class="notice" id="notice"></div>`;
}


/* ================= EFFECTS / RAFTERS PACKS =================
   Cosmetics are unlocked PER CARD. A pull grants one effect for one specific card,
   so "Volt for LeBron-CLE" is a different unlock from "Volt for LeBron-MIA".
   Only Gold+ cards can carry effects, and the card roll is SPOTLIGHT-weighted so
   you mostly pull names you recognise. Duplicates refund credits. */
const EFX_KEY="atu-efx-v1";
const EFX_TIERS=["Common","Uncommon","Rare","Mythic"];
const EFX_TIER_COLOR={Common:"#9aa4b2",Uncommon:"#3ddc84",Rare:"#35d6ff",Mythic:"#ff7ac8"};
/* pack odds — mythic sits at 2%, in Black Ice territory once split across the pool */
const EFX_ODDS={Common:62,Uncommon:26,Rare:10,Mythic:2};
const PACK_COST=400, PITY_AT=45;
/* refund when you pull something you already own for that card */
const EFX_REFUND={Common:40,Uncommon:90,Rare:220,Mythic:900};

const EFFECTS=[

  {id:"f-blade", n:"Blade",     k:"frame", t:"Common"},

  {id:"e-volt",  n:"Volt",      k:"energy", t:"Rare"},

  {id:"o-sparks",n:"Sparks",         k:"overlay", t:"Mythic"},
  {id:"o-holo",  n:"Diamond Holo",   k:"overlay", t:"Mythic"},
];
const EFX_BY_ID={}; EFFECTS.forEach(e=>EFX_BY_ID[e.id]=e);
const EFX_SLOT={frame:"frame",aura:"aura",sheen:"sheen",energy:"energy",overlay:"overlay"};
const EFX_SLOT_LABEL={frame:"Frame",aura:"Aura",sheen:"Sheen",energy:"Energy",overlay:"Overlay"};

function emptyEfx(){return {owned:{},equip:{},packs:0,sincePity:0,log:[]};}
let EFX=sGet(EFX_KEY)||emptyEfx();
/* heal anything malformed so a bad save can never break pack opening */
if(!EFX||typeof EFX!=="object")EFX=emptyEfx();
if(!EFX.owned||typeof EFX.owned!=="object")EFX.owned={};
if(!EFX.equip||typeof EFX.equip!=="object")EFX.equip={};
if(typeof EFX.packs!=="number")EFX.packs=0;
if(typeof EFX.sincePity!=="number")EFX.sincePity=0;
if(!Array.isArray(EFX.log))EFX.log=[];
function saveEfx(){sSet(EFX_KEY,EFX);}

/* ---- ownership ---- */
const efxKey=(cardId,efxId)=>cardId+"|"+efxId;
function ownsEfx(cardId,efxId){return !!EFX.owned[efxKey(cardId,efxId)];}
function grantEfx(cardId,efxId){
  const k=efxKey(cardId,efxId);
  const dupe=!!EFX.owned[k];
  EFX.owned[k]=(EFX.owned[k]||0)+1;
  saveEfx();
  return dupe;
}
function efxOwnedFor(cardId){
  return EFFECTS.filter(e=>ownsEfx(cardId,e.id));
}
function efxOwnedCount(){return Object.keys(EFX.owned).length;}

/* ---- which cards can carry effects: Gold and above, never depth players ---- */
function efxEligible(p){
  if(!p)return false;
  if(typeof isDepthOnly==="function"&&isDepthOnly(p))return false;
  return p.tier==="Gold"||p.tier==="Elite"||p.tier==="Icon";
}
function efxCardPool(){return DB.filter(efxEligible);}

/* ---- rolling ---- */
function rollEfxTier(force){
  if(force)return force;
  /* pity: guarantee a mythic once the counter hits the threshold */
  if(EFX.sincePity>=PITY_AT-1)return "Mythic";
  const r=Math.random()*100; let acc=0;
  for(const t of EFX_TIERS){acc+=EFX_ODDS[t]; if(r<=acc)return t;}
  return "Common";
}
function rollEfxOfTier(t){
  const pool=EFFECTS.filter(e=>e.t===t);
  return pool[Math.floor(Math.random()*pool.length)];
}
/* SPOTLIGHT-weighted card roll so recognisable names dominate the pulls */
function rollEfxCard(){
  const pool=efxCardPool();
  const w=pool.map(p=>Math.pow(SPOTLIGHT[p.name]??1,1.35)+0.05);
  let total=0; w.forEach(x=>total+=x);
  let r=Math.random()*total;
  for(let i=0;i<pool.length;i++){r-=w[i]; if(r<=0)return pool[i];}
  return pool[pool.length-1];
}
/* one pull = one effect for one card */
function openRaftersPack(force){
  const tier=rollEfxTier(force);
  const efx=rollEfxOfTier(tier);
  const card=rollEfxCard();
  const dupe=grantEfx(card.id,efx.id);
  let refund=0;
  if(dupe){refund=EFX_REFUND[tier]||0;
    if(typeof awardCredits==="function")awardCredits(refund,"Duplicate refunded");}
  EFX.packs++;
  EFX.sincePity = (tier==="Mythic") ? 0 : EFX.sincePity+1;
  EFX.log.unshift({c:card.id,e:efx.id,t:tier,d:dupe,at:Date.now()});
  EFX.log=EFX.log.slice(0,60);
  saveEfx();
  return {tier,efx,card,dupe,refund};
}
/* free packs earned from play, banked until opened */
function grantPack(n,reason){
  EFX.free=(EFX.free||0)+(n||1);saveEfx();
  if(typeof creditToast==="function")creditToast(n||1,(reason||"Pack earned"));
}
function packsAvailable(){return (EFX.free||0);}
function spendPack(){
  if((EFX.free||0)>0){EFX.free--;saveEfx();return "free";}
  if(CR.bal>=PACK_COST){CR.bal-=PACK_COST;saveCredits();return "credits";}
  return null;
}

/* ---- equipping ---- */
function equipEfx(cardId,efxId){
  const e=EFX_BY_ID[efxId]; if(!e)return;
  if(!ownsEfx(cardId,efxId))return;
  EFX.equip[cardId]=EFX.equip[cardId]||{};
  const slot=EFX_SLOT[e.k];
  /* tapping an equipped effect takes it off */
  EFX.equip[cardId][slot] = (EFX.equip[cardId][slot]===efxId) ? null : efxId;
  saveEfx();
}
function equippedFor(cardId){return EFX.equip[cardId]||{};}
/* the class string a card should carry */
function efxClasses(p){
  if(!p)return "";
  const eq=equippedFor(p.id);
  const out=[];
  ["frame","aura","sheen","energy"].forEach(s=>{if(eq[s])out.push(eq[s]);});
  if(eq.energy)out.push("on-sfx");
  if(eq.aura)out.push("has-aura");
  return out.join(" ");
}
function overlayFor(p){const eq=equippedFor(p&&p.id);return eq.overlay||null;}


/* ---- overlay painters: canvas effects mount after render ---- */
const EFXOV_RAF={};
function mountEfxOverlays(){
  document.querySelectorAll(".efxov[data-ov]").forEach(el=>{
    if(el.dataset.mounted)return; el.dataset.mounted="1";
    const id=el.dataset.ov;

}
function ovSize(el){const r=el.getBoundingClientRect();
  return {w:Math.max(40,Math.round(r.width)),h:Math.max(60,Math.round(r.height))};}

function paintFrostOv(el){

function paintBoltOv(el){
  const {w,h}=ovSize(el);
  el.innerHTML=`<canvas width="${w}" height="${h}"></canvas>`;
  const c=el.querySelector("canvas"),g=c.getContext&&c.getContext("2d"); if(!g)return;
  let st=null,next=0;
  function bp(x1,y1,x2,y2,d,out,dep){
    if(d<1.6){out.push([x1,y1,x2,y2]);return;}
    let mx=(x1+x2)/2,my=(y1+y2)/2;
    const nx=-(y2-y1),ny=(x2-x1),L=Math.hypot(nx,ny)||1,off=(Math.random()-.5)*d;
    mx+=nx/L*off;my+=ny/L*off;
    bp(x1,y1,mx,my,d/2,out,dep+1);bp(mx,my,x2,y2,d/2,out,dep+1);
    if(dep<3&&Math.random()<.4){const bx=mx+(x2-x1)*(.3+Math.random()*.4)+(Math.random()-.5)*14;
      const by=my+(y2-y1)*(.3+Math.random()*.4)+(Math.random()-.5)*10;
      bp(mx,my,bx,by,d/2.1,out,dep+2);}
  }
  function loop(t){
    if(!el.isConnected){delete EFXOV_RAF[el.dataset.card];return;}
    if(!st||t>st.until){
      if(t>next){const s=[];bp(w*.2+Math.random()*w*.6,-6,w*.2+Math.random()*w*.6,h+6,w*.28,s,0);
        st={segs:s,t0:t,until:t+80+Math.random()*120};next=t+400+Math.random()*1800;}
      else g.clearRect(0,0,w,h);
    }
    if(st&&t<=st.until){
      const k=(t-st.t0)/(st.until-st.t0);
      const a=k<.12?1:k<.24?.35:k<.42?.95:Math.max(0,1-(k-.42)/.58);
      g.clearRect(0,0,w,h);g.globalCompositeOperation="lighter";
      g.strokeStyle=`rgba(60,180,255,${a*.5})`;g.lineWidth=3;g.shadowColor="#35d6ff";g.shadowBlur=9;
      g.beginPath();st.segs.forEach(s=>{g.moveTo(s[0],s[1]);g.lineTo(s[2],s[3]);});g.stroke();
      g.strokeStyle=`rgba(235,252,255,${a})`;g.lineWidth=1;g.shadowBlur=5;
      g.beginPath();st.segs.forEach(s=>{g.moveTo(s[0],s[1]);g.lineTo(s[2],s[3]);});g.stroke();
      g.shadowBlur=0;
    }
    EFXOV_RAF[el.dataset.card]=requestAnimationFrame(loop);
  }
  EFXOV_RAF[el.dataset.card]=requestAnimationFrame(loop);
}
function paintSparksOv(el){
  const {w,h}=ovSize(el);
  el.innerHTML=`<canvas width="${w}" height="${h}"></canvas>`;
  const c=el.querySelector("canvas"),g=c.getContext&&c.getContext("2d"); if(!g)return;
  const EM=[],step=Math.max(8,Math.round(w/9));
  for(let x=4;x<=w-4;x+=step){EM.push({x,y:h-3,nx:0,ny:-1});EM.push({x,y:3,nx:0,ny:1});}
  for(let y=8;y<=h-8;y+=step){EM.push({x:3,y,nx:1,ny:0});EM.push({x:w-3,y,nx:-1,ny:0});}
  const P=[],MAX=Math.round(w*h/220);
  const col=(l,a)=>l>.82?`rgba(255,250,225,${a})`:l>.62?`rgba(255,222,120,${a})`:
    l>.42?`rgba(255,158,44,${a})`:l>.22?`rgba(232,74,10,${a})`:`rgba(120,22,4,${a*.8})`;
  function loop(t){
    if(!el.isConnected){delete EFXOV_RAF[el.dataset.card];return;}
    g.clearRect(0,0,w,h);g.globalCompositeOperation="lighter";
    for(let i=0;i<3;i++){ if(P.length<MAX){const e=EM[(Math.random()*EM.length)|0];
      const sp=(Math.random()-.5)*.7;
      P.push({x:e.x,y:e.y,vx:e.nx*(.2+Math.random()*.4)+sp*.6,
        vy:e.ny*(.2+Math.random()*.4)-(.3+Math.random()*.6),
        life:1,decay:.02+Math.random()*.03,r:3+Math.random()*5,seed:Math.random()*6.28});}}
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.life-=p.decay;
      if(p.life<=0){P.splice(i,1);continue;}
      p.x+=p.vx+Math.sin(t/170+p.seed)*(1-p.life)*.8;p.y+=p.vy;p.vy-=.008;
      const rad=p.r*(.35+p.life*.75);
      const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);
      gr.addColorStop(0,col(p.life,.5*p.life));
      gr.addColorStop(.55,col(p.life*.7,.2*p.life));
      gr.addColorStop(1,"rgba(0,0,0,0)");
      g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,rad,0,6.283);g.fill();}
    EFXOV_RAF[el.dataset.card]=requestAnimationFrame(loop);
  }
  EFXOV_RAF[el.dataset.card]=requestAnimationFrame(loop);
}

/* Buying happens on first contact with the zipper. Returns false when the pull
   can't be afforded, which aborts the drag before anything moves. */
function rfArm(){
  if(RF.done)return false;
  if(RF.open&&RF.pull)return true;
  const paid=spendPack();

  if(!paid){notice("Not enough credits \u2014 play a run, the daily or Pack Mode.");return false;}

/* Reset the stage to a fresh sealed pack. Nothing is charged until it's pulled. */
function raftersAgain(){
  if(typeof RF.unbind==="function")RF.unbind();
  cancelAnimationFrame(RF.raf);
  RF={open:false,prog:0,done:false,pull:null,drag:false,raf:null};
  render();

  (window.requestAnimationFrame||setTimeout)(()=>{rfBind();rfSetGlow(true);rfApply(0);});

/* the whole backdrop, seam light and spill read from one variable */
/* neutral=true paints a colourless backdrop so nothing is spoiled pre-peel */
function rfSetGlow(neutral){
  const a=$("#rfarena"); if(!a)return;
  const c=neutral?"#3a3f4a":((RF.pull&&EFX_TIER_COLOR[RF.pull.tier])||"#3a3f4a");
  a.style.setProperty("--rf-glow",c);
}
function rfBind(){
  const tab=$("#rftab"),stage=$("#rfstage");
  if(!tab||!stage||tab.dataset.bound)return;
  tab.dataset.bound="1";

  /* Re-renders replace the zipper node. Clear old window listeners first so
     repeated Rafters packs never accumulate input handlers. */
  if(typeof RF.unbind==="function")RF.unbind();
  const removers=[];
  const on=(el,type,fn,opts)=>{
    el.addEventListener(type,fn,opts);
    removers.push(()=>el.removeEventListener(type,fn,opts));
  };
  RF.unbind=()=>{removers.splice(0).forEach(off=>off());RF.drag=false;};

  let pointerId=null,startX=0,startProg=0,moved=false,suppressClickUntil=0;
  const pointX=e=>{
    if(Number.isFinite(e.clientX))return e.clientX;
    const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0]);
    return t&&Number.isFinite(t.clientX)?t.clientX:null;
  };
  const down=e=>{
    if(RF.done)return;
    const x=pointX(e);if(x==null)return;
    if(!rfArm()){if(e.cancelable)e.preventDefault();return;}
    RF.drag=true;pointerId=e.pointerId??null;startX=x;startProg=RF.prog;moved=false;
    $("#rfpack")?.classList.add("live");
    if(e.pointerId!=null&&tab.setPointerCapture){
      try{tab.setPointerCapture(e.pointerId);}catch(_){/* harmless on older iOS */}
    }
    if(e.cancelable)e.preventDefault();
  };
  const move=e=>{
    if(!RF.drag||RF.done)return;
    if(pointerId!=null&&e.pointerId!=null&&e.pointerId!==pointerId)return;
    const x=pointX(e);if(x==null)return;
    if(Math.abs(x-startX)>5)moved=true;
    const b=stage.getBoundingClientRect();
    rfApply(startProg+(x-startX)/Math.max(1,b.width-28));
    if(RF.prog>=0.78)rfBurst();
    if(e.cancelable)e.preventDefault();
  };
  const up=e=>{
    if(!RF.drag||RF.done)return;
    if(pointerId!=null&&e&&e.pointerId!=null&&e.pointerId!==pointerId)return;
    RF.drag=false;pointerId=null;
    if(e&&e.cancelable)e.preventDefault();
    if(!moved&&RF.prog<=0.02){
      suppressClickUntil=Date.now()+550;
      rfSpring(0,1,820,rfBurst);
    }else if(RF.prog>=0.46)rfBurst();
    else rfSpring(RF.prog,0,220);
  };

  /* The silver tab is the zipper and the only interaction target.
     Pointer Events only — every browser that can parse this file's ?. and ??
     syntax (Safari 13.1+, Chrome 80+, Firefox 72+) supports them, so a
     mouse/touch fallback here would be unreachable code. */
  on(tab,"pointerdown",down,{passive:false});
  on(window,"pointermove",move,{passive:false});
  on(window,"pointerup",up,{passive:false});
  on(window,"pointercancel",up,{passive:false});
  on(tab,"click",e=>{
    if(Date.now()<suppressClickUntil||RF.done||RF.prog>0.02)return;
    if(e.cancelable)e.preventDefault();
    if(!rfArm())return;
    rfSpring(0,1,820,rfBurst);
  });
}
function rfApply(p){
  RF.prog=Math.max(0,Math.min(1,p));
  const seam=10,ease=RF.prog*RF.prog*(3-2*RF.prog),gap=2+ease*12;
  const top=$("#rftop"),bot=$("#rfbot"),tab=$("#rftab"),
        vd=$("#rfvoid"),sp=$("#rfspill"),ar=$("#rfarena"),st=$("#rfstage");
  /* A re-render can swap the stage out mid-animation, so every node is optional
     from here down — a missing one skips its own writes instead of throwing and
     killing the spring loop. */
  if(!st)return;

  const sw=st.clientWidth||1, sh=st.clientHeight||1;
  const travel=Math.max(0,sw-28),px=travel*RF.prog;
  const tabPct=14+px;
  const xPct=(tabPct/sw)*100;
  const gapPct=(gap/sh)*100;

  /* Right side stays sealed. Only the already-zipped left section separates,
     producing one crisp opening that follows the tab. */
  if(top){
    top.style.clipPath=`polygon(0 0,100% 0,100% ${seam}%,${xPct}% ${seam}%,${xPct}% ${seam-gapPct}%,0 ${seam-gapPct}%)`;
    top.style.transform="translateY(0) rotate(0deg)";
  }
  if(bot){
    bot.style.clipPath=`polygon(0 ${seam+gapPct}%,${xPct}% ${seam+gapPct}%,${xPct}% ${seam}%,100% ${seam}%,100% 100%,0 100%)`;
    bot.style.transform="translateY(0) rotate(0deg)";
  }
  if(tab){
    tab.style.left=tabPct+"px";
    tab.style.setProperty("--zip-p",RF.prog.toFixed(3));
  }
  if(vd){
    vd.style.width=Math.max(0,px)+"px";
    vd.style.opacity=RF.prog<.015?0:Math.min(1,.2+RF.prog*1.35);
  }
  if(sp){
    sp.style.width=Math.max(0,px)+"px";
    sp.style.opacity=Math.min(.68,RF.prog*.86);
    sp.style.transform=`scaleY(${0.18+RF.prog*.72})`;
  }

  if(ar){
    ar.style.setProperty("--rf-lift",(0.30+RF.prog*0.58).toFixed(2));
    if(RF.prog>0.08)rfSetGlow(false); else rfSetGlow(true);
  }
  const pack=$("#rfpack");
  if(pack){
    if(RF.prog>0.01)pack.classList.add("live");
    else pack.classList.remove("live");
  }
}
function rfSpring(from,to,ms,cb){
  const t0=performance.now();
  cancelAnimationFrame(RF.raf);
  (function step(){
    const k=Math.min(1,(performance.now()-t0)/ms);
    const e=to>from?1-Math.pow(1-k,3):k*k;
    rfApply(from+(to-from)*e);
    if(k<1)RF.raf=requestAnimationFrame(step);
    else{ if(cb)cb(); else $("#rfpack").classList.remove("live"); }
  })();
}
function rfBurst(){
  if(RF.done)return; RF.done=true; RF.drag=false;
  rfSpring(RF.prog,1,300,()=>{
    const top=$("#rftop"),bot=$("#rfbot"),st=$("#rfstage");
    if(top&&top.animate){
      top.animate([{transform:top.style.transform,opacity:1},
        {transform:"translateY(-260px) rotate(-15deg)",opacity:0}],
        {duration:560,easing:"cubic-bezier(.3,.8,.3,1)",fill:"forwards"});
      bot.animate([{transform:bot.style.transform,opacity:1},
        {transform:"translateY(240px) rotate(9deg)",opacity:0}],
        {duration:560,easing:"cubic-bezier(.3,.8,.3,1)",fill:"forwards"});
    }
    setTimeout(()=>{if(st){st.style.transition="opacity .35s";st.style.opacity=0;}},260);
    setTimeout(rfReveal,420);
  });
}

function cardSlug(name){
  return name.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") /* strip accents: Doncic -> doncic */
    .replace(/[.'\u2019]/g,"")      /* drop periods & apostrophes */
    .replace(/[^a-z0-9]+/g,"-")     /* everything else -> hyphen */
    .replace(/^-+|-+$/g,"");
}
/* iOS hides file extensions, so uploads often land as "name.png.PNG", "name.PNG",
   or a JPEG that was never actually converted. Rather than fight the filename on
   every upload, the card tries a list of likely variants and uses whichever exists. */
const CARD_ART_EXTS=[".png",".PNG",".png.PNG",".png.png",".jpg",".jpeg",".JPG",".webp"];
/* ---- per-CARD art ----
   A player can have several cards (Jimmy Butler CHI and Jimmy Butler MIA are different
   players in different kits), so art is keyed by name+team first. If no team-specific
   file is registered we fall back to the plain name slug, which keeps single-card
   players on one simple filename. */
function cardSlugCard(p){return cardSlug(p.name)+"-"+String(p.team||"").toLowerCase();}
/* names that appear on more than one card — only these need a team suffix */
const MULTI_CARD_NAMES=(()=>{const c={},s=new Set();DB.forEach(p=>{c[p.name]=(c[p.name]||0)+1;});
  Object.keys(c).forEach(n=>{if(c[n]>1)s.add(n);});return s;})();
function cardSlugFor(p){
  const c=cardSlugCard(p),n=cardSlug(p.name);
  if(CARD_ART.has(c))return c;      /* an explicit team-specific file always wins */
  /* a plain-name file covers a SINGLE-card player. For a multi-card player it only
     covers their primary (highest-OVR) card, so their other kits fall through to a
     team slug and don't wrongly reuse the same art. */
  if(CARD_ART.has(n)){
    if(!MULTI_CARD_NAMES.has(p.name))return n;
    const cards=DB.filter(q=>q.name===p.name);
    const primary=cards.reduce((a,b)=>b.ovr>a.ovr?b:a,cards[0]);
    if(p.team===primary.team)return n;   /* plain file = the primary card */
    return c;                             /* other kits use their team slug */
  }
  return MULTI_CARD_NAMES.has(p.name)?c:n;
}
function cardArtVariants(p){const s=cardSlugFor(p);return CARD_ART_EXTS.map(e=>CARD_ART_BASE+s+e);}
/* fallback attributes for an art <img>: walks CARD_ART_EXTS until one loads */
function cardArtFallbackAttr(p){
  return `onerror="collArtFail(this)" data-v="0" data-slug="${cardSlugFor(p)}"`;
}
/* simpler fallback for collection tiles — just hides the art, keeps the tile */
function collArtFail(img){
  const i=(+img.dataset.v||0)+1,slug=img.dataset.slug;
  if(i<CARD_ART_EXTS.length){img.dataset.v=i;img.src=CARD_ART_BASE+slug+CARD_ART_EXTS[i];return;}
  img.remove();
}
function cardArtFail(img){
  const i=(+img.dataset.v||0)+1,slug=img.dataset.slug;
  if(i<CARD_ART_EXTS.length){img.dataset.v=i;img.src=CARD_ART_BASE+slug+CARD_ART_EXTS[i];return;}
  /* out of variants: hide the art layer and restore the initials look */
  const card=img.closest(".card");if(card){card.classList.remove("hasart");
    const wrap=card.querySelector(".cardartwrap");if(wrap)wrap.remove();
    if(!card.querySelector(".ini")){const nm=card.querySelector(".nm");
      const ini=document.createElement("div");ini.className="ini";
      ini.textContent=(nm?nm.textContent:"").split(" ").map(s=>s[0]||"").join("").slice(0,2).toUpperCase();
      card.insertBefore(ini,nm);}}

/* Dev helper: run artStatus() in the console to see coverage + copy-paste slugs.
   Lists how many players have art and prints the slug for any name you pass. */
function artStatus(filter){
  /* one row per CARD, since multi-team players need separate art */
  const cards=DB.map(p=>({name:p.name,team:p.team,era:p.era,ovr:p.ovr,slug:cardSlugFor(p),has:hasArt(p)}));
  const seen={},uniq=[];cards.forEach(c=>{if(!seen[c.slug]){seen[c.slug]=1;uniq.push(c);}});
  const done=uniq.filter(c=>c.has);
  console.log(`Card art: ${done.length}/${uniq.length} cards covered (${(done.length/uniq.length*100).toFixed(1)}%).`);
  if(filter){
    const hits=uniq.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase()));
    console.log(`Filenames for "${filter}":`);
    hits.forEach(c=>console.log(`  ${c.name} (${c.ovr} ${c.team} ${c.era})  ->  ${c.slug}.png${c.has?"  [HAS ART]":""}`));
  } else console.log('Tip: artStatus("butler") to get the exact filename for a player.');
  return {covered:done.length,total:uniq.length,missing:uniq.length-done.length};
}

    <div class="bk-lab">Card</div><div class="bk-val">${p.tier} tier · ${SLOTNAMES(p)}</div>
    <div class="bk-flip">↺ tap to flip back</div>
  </div>`;
  const core=`<div class="c3d"><div class="c3din">
    <div class="c3face c3front">${front}</div>
    <div class="c3face c3back">${back}</div>
  </div></div>`;
  /* The aura lives on a WRAPPER, not inside the card. That lets the card keep
     overflow:hidden — so the Icon's sliding flare stays contained — while the
     aura glow still spills outside. */
  const wrapped=hasAura
    ? `<div class="aurahost ${efx.split(" ").filter(c=>/^a-/.test(c)).join(" ")}">`+
      `<div class="efxaura2"></div><div class="efxaura"></div>${core}</div>`

  return p.tier==="Icon"?`<div class="flame${hasAura?" flame-dim":""}">${wrapped}</div>`:wrapped;}

function flip3d(e){e.stopPropagation();e.preventDefault();
  const n=e.target.closest(".c3din");if(n)n.classList.toggle("flipped3");}
/* ---- enlarged card viewer ----
   The info button lifts the card out into a floating overlay so the artwork and the
   chemistry dossier on the back can actually be read. Tap the card to flip it. */
function openCardZoom(e,pid){
  if(e){e.stopPropagation();e.preventDefault();}
  const p=DB[pid];if(!p)return;
  const o=$("#cardzoom");if(!o)return;
  o.innerHTML=`<div class="zoomwrap">
      <div class="zoomfloat"><div class="zoomscale">${cardHTML(p)}</div></div>
      <div class="zoomhint">tap the card to flip · tap outside to close</div>
      <button class="zoomclose" onclick="closeCardZoom(event)">Close</button>
    </div>`;
  /* the copy inside the overlay flips on tap, and its own info button just flips too */
  const inner=o.querySelector(".c3din");
  if(inner){
    o.querySelectorAll(".infobtn").forEach(b=>{b.setAttribute("onclick","flip3d(event)");b.title="Flip card";});
    const sc=o.querySelector(".zoomscale");
    sc.addEventListener("click",ev=>{
      if(ev.target.closest(".infobtn"))return;      /* handled by flip3d */
      if(sc.dataset.peeked==="1"){sc.dataset.peeked="";return;} /* a hold-to-peek shouldn't flip */
      inner.classList.toggle("flipped3");
    });
    /* touch devices have no hover, so hold the card to fade the text and admire the art */
    let holdT=null;
    const startHold=()=>{clearTimeout(holdT);holdT=setTimeout(()=>{sc.classList.add("peek");sc.dataset.peeked="1";},220);};
    const endHold=()=>{clearTimeout(holdT);sc.classList.remove("peek");};
    sc.addEventListener("touchstart",startHold,{passive:true});
    sc.addEventListener("touchend",endHold);
    sc.addEventListener("touchcancel",endHold);
    sc.addEventListener("touchmove",endHold,{passive:true});
  }
  o.classList.add("show");
  o.onclick=ev=>{if(ev.target===o)closeCardZoom(ev);};
  document.body.style.overflow="hidden";
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const o=$("#cardzoom");if(o&&o.classList.contains("show"))closeCardZoom(e);}});

function openSheet(pid,side){
  const p=DB[pid];
  $("#sheet").innerHTML=`<div class="sheetbox"><h3>${esc(p.name)} — ${p.ovr} OVR</h3>
    <div class="who">${p.positions.join(" / ")} · ${p.team} · ${p.era} · ${p.tier}.

  $("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet();};
}
function closeSheet(){$("#sheet").classList.remove("show");$("#sheet").innerHTML="";}
function openPicker(side,slot){
  const p=slotPos(slot),cur=S[side].roster[slot];
  const pool=ownedList(side).filter(c=>eligible(c,slot));
  /* players already in OTHER slots are movable straight into this one */
  const rostered=ALL_SLOTS.filter(s=>s!==slot&&S[side].roster[s]!=null)
    .map(s=>({p:DB[S[side].roster[s]],from:s})).filter(x=>eligible(x.p,slot));
  $("#sheet").innerHTML=`<div class="sheetbox">
    <h3>${cur!=null?"Swap":"Select"} ${SLOT_LABEL[slot]}${p!=="B"?` (${p})`:""}</h3>
    <div class="who">${p==="B"?"Any position qualifies for the bench.":`Showing everyone in your collection who can play ${p}.`}
    ${cur!=null?` Currently: <b style="color:var(--ink)">${esc(DB[cur].name)} ${DB[cur].ovr}</b>.`:""}</div>
    ${cur!=null?`<button class="btn danger" onclick="unslot('${side}','${slot}');closeSheet()">Remove ${esc(DB[cur].name)}</button>`:""}
    <div class="pickgrid">${pool.length||rostered.length?
      pool.map(c=>cardHTML(c,`onclick="pickInto(${c.id},'${side}','${slot}')"`)).join("")
      +rostered.map(x=>cardHTML(x.p,`onclick="pickMove(${x.p.id},'${side}','${slot}','${x.from}')"`,
        `<div class="fromtag">AT ${x.from}</div>`)).join("")
      :`<div class="empty">No eligible cards in your collection${p!=="B"?` for ${p}`:""} — open more packs.</div>`}</div>
    <button class="btn" onclick="closeSheet()">Cancel</button></div>`;
  $("#sheet").classList.add("show");
  $("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet();};
}
function pickInto(pid,side,slot){place(pid,side,slot);} /* place() closes + rerenders */
function moveInto(pid,side,slot,from){
  const p=DB[pid],r=S[side].roster;
  if(!eligible(p,slot)){notice(`${p.name} plays ${p.positions.join("/")} — can't fill the ${SLOT_LABEL[slot]} slot.`);return false;}
  if(from==="coll"){
    if(rosterHas(r,pid)){notice("That exact card is already in your roster.");return false;}
    if(r[slot]!=null)S[side].coll[r[slot]]=(S[side].coll[r[slot]]||0)+1; // return occupant
    r[slot]=pid;S[side].coll[pid]--;if(S[side].coll[pid]<=0)delete S[side].coll[pid];
  }else{
    if(from===slot)return false;
    const occ=r[slot];
    r[from]=null;
    if(occ!=null){ // swap back if legal, otherwise occupant returns to the collection
      if(eligible(DB[occ],from))r[from]=occ;
      else S[side].coll[occ]=(S[side].coll[occ]||0)+1;
    }
    r[slot]=pid;
  }
  afterRosterChange(side);return true;
}
function place(pid,side,slot){if(moveInto(pid,side,slot,"coll"))closeSheet();}
function pickMove(pid,side,slot,from){if(moveInto(pid,side,slot,from))closeSheet();}
function unslot(side,slot){
  const r=S[side].roster,pid=r[slot];if(pid==null)return;
  r[slot]=null;S[side].coll[pid]=(S[side].coll[pid]||0)+1;afterRosterChange(side);
}
function discard(pid,side){
  S[side].coll[pid]--;if(S[side].coll[pid]<=0)delete S[side].coll[pid];
  closeSheet();save();render();notice(`Discarded ${DB[pid].name}.`);
}
function autoFill(side){
  const r=S[side].roster;
  // pool = everything owned + everything slotted, unique ids
  const pool=new Set(Object.keys(S[side].coll).map(Number));
  ALL_SLOTS.forEach(s=>{if(r[s]!=null)pool.add(r[s]);});
  const players=[...pool].map(id=>DB[id]).sort((a,b)=>b.ovr-a.ovr);
  const fresh=emptyRoster(),used=new Set();
  ["C","PF","SF","SG","PG"].forEach(s=>{
    const p=players.find(x=>!used.has(x.id)&&x.positions.includes(s));
    if(p){fresh[s]=p.id;used.add(p.id);}});
  BENCH_SLOTS.forEach(s=>{const p=players.find(x=>!used.has(x.id));
    if(p){fresh[s]=p.id;used.add(p.id);}});
  // rebuild collection counts: total copies minus the ones slotted
  const counts={};[...pool].forEach(id=>counts[id]=(S[side].coll[id]||0)+(rosterHas(r,id)?1:0));
  used.forEach(id=>counts[id]--);
  S[side].coll={};Object.entries(counts).forEach(([id,n])=>{if(n>0)S[side].coll[id]=n;});
  S[side].roster=fresh;afterRosterChange(side);notice("Best legal lineup set by OVR.");
}
function afterRosterChange(side){
  const t=teamOVR(S[side].roster).total;
  bump(side);save();trophyRoster(side,S[side].roster);render();
  if(t>lastOVR[side]){const el=$("#ovr-"+side);if(el){el.classList.add("bump");setTimeout(()=>el.classList.remove("bump"),260);}}
  lastOVR[side]=t;
}
function confirmReset(side){
  $("#sheet").innerHTML=`<div class="sheetbox"><h3>Start over?</h3>
    <div class="who">This clears your ${side==="rare"?"Rare-Pull":""} collection and roster. Your best OVR high score is kept.</div>
    <button class="btn danger" onclick="doReset('${side}')">Yes — reset everything</button>
    <button class="btn" onclick="closeSheet()">Cancel</button></div>`;
  $("#sheet").classList.add("show");
  $("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet();};
}
function doReset(side){
  S[side]=side==="classic"?emptyClassic():emptySide();
  lastOVR[side]=60;save();closeSheet();render();
  notice(side==="classic"?"New Pack Mode run — "+S.classic.cap+" pack budget this time. High score preserved.":"Fresh start. High score preserved.");}
</script>
<script>
/* ================= PACKS SCREEN ================= */
function oddsHTML(key){

/* ================= REVEAL OVERLAY ================= */
const SUSPENSE={Bronze:350,Silver:500,Gold:900,Elite:1500,Icon:2200};
let REV=null; // {cards, side, packKey, flipped:[]}
let RECENT=(sGet("atu-recent-v1")||[]).map(pk=>Array.isArray(pk)?pk.filter(id=>DB[id]):[]).filter(pk=>pk.length); // ids from the last 2 packs, persisted across resets (stale ids dropped)
/* hydrate the pull-memory randomizer now that storage helpers exist */
try{
  PACK_NO=sGet("atu-packno-v2")||0;
  PULL_AT=sGet("atu-pullhist-v2")||{};
  NAME_PULL_AT=sGet("atu-namehist-v2")||{};
  const dk=sGet("atu-decks-v2");
  if(dk&&typeof dk==="object")TIER_DECKS=dk; /* reconcileDeck() folds in any new cards */
  const df=sGet(DRAFT_FAIR_KEY);
  if(df&&typeof df==="object"){
    DRAFT_FAIR_SESSION=Number.isFinite(df.session)?df.session:0;
    DRAFT_NAME_SHOWN=df.shown&&typeof df.shown==="object"?df.shown:{};
    DRAFT_NAME_LAST=df.last&&typeof df.last==="object"?df.last:{};
    DRAFT_CARD_SHOWN=df.cards&&typeof df.cards==="object"?df.cards:{};
  }
}catch(e){}
function recentSet(){return new Set(RECENT.flat());}
function noteRecent(cards){RECENT.push(cards.map(c=>c.id));RECENT=RECENT.slice(-2);sSet("atu-recent-v1",RECENT);}
function ownedIds(side){
  const ids=new Set(Object.keys(S[side].coll).map(Number));
  ALL_SLOTS.forEach(s=>{if(S[side].roster[s]!=null)ids.add(S[side].roster[s]);});
  return ids;
}
function openPack(packKey,side){
  if(side==="classic"){
    const cl=S.classic;
    if(cl.opened>=cl.cap){notice("Pack budget spent — "+cl.cap+" total. Build your roster from what you pulled.");return;}
    if(packKey==="premium"){if(cl.premiumPacksLeft<=0){notice("Premium pack budget spent — 3 per run.");return;}cl.premiumPacksLeft--;}
    const cards=classicRollPack(ownedIds("classic"),cl.tierCounts,recentSet(),packKey);
    noteRecent(cards);cl.opened++;
    if(typeof creditsForRun==="function")creditsForRun("pack");
    cards.forEach(c=>{cl.coll[c.id]=(cl.coll[c.id]||0)+1;});
    save();trophyPack(cards);
    REV={cards,side:"classic",packKey,dupes:[false,false,false],flipped:[false,false,false],busy:false};
    renderReveal();return;
  }
  const owned=ownedIds(side);
  const cards=rollPack(packKey,owned,recentSet());
  if(!cards)return;
  noteRecent(cards);

/* v35 state invariant: older/touch-interrupted sessions could retain selected IDs
   in D.taken while losing their slot assignment. Rebuild those orphan selections
   into legal empty slots before rendering, then derive completion from the court. */
function reconcileDraftState(){
  D.roster=D.roster||emptyRoster();
  ALL_SLOTS.forEach(s=>{if(!(s in D.roster))D.roster[s]=null;});
  D.taken=Array.isArray(D.taken)?D.taken.filter(id=>DB[id]):[];
  const placedIds=new Set(ALL_SLOTS.map(s=>D.roster[s]).filter(id=>id!=null));
  const placedNames=new Set([...placedIds].map(id=>DB[id].name));
  const orphans=[];
  D.taken.forEach(id=>{const p=DB[id];if(!placedIds.has(id)&&!placedNames.has(p.name)){orphans.push(id);placedNames.add(p.name);}});
  orphans.forEach(id=>{
    const p=DB[id];
    const slot=DRAFT_ORDER.find(s=>D.roster[s]==null&&eligible(p,s));
    if(slot!=null){D.roster[slot]=id;placedIds.add(id);}
  });
  D.taken=ALL_SLOTS.map(s=>D.roster[s]).filter(id=>id!=null);
  const full=ALL_SLOTS.every(s=>D.roster[s]!=null);
  if(full){D.done=true;D.stage="picking";D.activeSlot=null;D.opts=null;}
  else if(D.done)D.done=false;
  return full;
}
function startEraByIndex(i){const e=viableEras()[i];if(e)startDraft(e);}
/* Bail out of a half-finished draft. Same sheet pattern as the hub reset, so a
   destructive action always asks first. */
function confirmDraftReset(){
  if(D.stage!=="picking")return;
  const n=ALL_SLOTS.filter(s=>D.roster[s]!=null).length;
  $("#sheet").innerHTML=`<div class="sheetbox"><h3>Restart this draft?</h3>
    <div class="who">${n} pick${n===1?"":"s"} will be cleared and you'll choose a new captain.${DRAFT_ERA?" The "+eraLabel(DRAFT_ERA)+" era stays locked.":""} Your best draft OVR is kept.</div>
    <button class="btn danger" onclick="doDraftReset()">Yes \u2014 restart</button>
    <button class="btn" onclick="closeSheet()">Keep drafting</button></div>`;
  $("#sheet").classList.add("show");
  $("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet();};
}

function startDraft(era){
  DRAFT_ERA=era||null;
  beginDraftFairSession();

  D={stage:"captain",captain,roster:emptyRoster(),taken:[],opts:null,slotOpts:{},activeSlot:null,lastSlot:null,done:false,tierCounts:{},offeredNames:captain.map(p=>p.name)};
  render();
}
function pickCaptain(pid){
  const p=DB[pid];
  D.tierCounts[p.tier]=(D.tierCounts[p.tier]||0)+1; /* Icon captain spends an Icon slot */
  D.roster[p.pos]=pid;D.taken.push(pid);D.lastSlot=p.pos;D.stage="picking";
  reconcileDraftState();render();
}
/* A slot whose five options have been revealed but not yet spent. Only one may exist
   at a time: opening a slot commits you to drafting from it. Without this you could tap
   every empty slot to reveal all forty cards (options are cached, so Cancel never
   re-rolls), then cherry-pick the best whole roster — which trivialised the draft. */
function draftPendingSlot(){
  if(!D||!D.slotOpts)return null;
  return ALL_SLOTS.find(s=>D.slotOpts[s]&&D.roster[s]==null)||null;
}
function draftSlotTap(slot){
  if(D.stage!=="picking")return;
  if(D.roster[slot]!=null){
    if(D.done){openDraftSwap(slot);return;} /* final board: rearrange freely */
    notice("Draft picks are locked in — fill the empty slots.");return;}
  const pend=draftPendingSlot();
  if(pend&&pend!==slot){
    notice("Finish the "+(SLOT_LABEL[pend]||pend)+" pick first — one slot at a time.");return;}
  D.activeSlot=slot;
  if(!D.slotOpts[slot]){
    D.slotOpts[slot]=draftOptionsFor(slot,D.taken,D.tierCounts,D.offeredNames); /* cached: no re-roll via Cancel */
    D.offeredNames=[...new Set([...(D.offeredNames||[]),...D.slotOpts[slot].map(p=>p.name)])];
  }
  D.opts=D.slotOpts[slot];
  render();
}
function draftCapHit(tier){return DRAFT_LIMITS[tier]&&(D.tierCounts[tier]||0)>=DRAFT_LIMITS[tier];}
function draftPickInto(pid){
  const slot=D.activeSlot;if(!slot||D.roster[slot]!=null)return;
  const p=DB[pid];
  if(D.taken.some(id=>DB[id].name===p.name)){notice(p.name+" is already on your board.");return;}
  if(draftCapHit(p.tier)){notice(p.tier+" cap reached ("+DRAFT_LIMITS[p.tier]+" per draft).");return;}
  if(DRAFT_LIMITS[p.tier])D.tierCounts[p.tier]=(D.tierCounts[p.tier]||0)+1;
  D.roster[slot]=pid;D.taken.push(pid);D.lastSlot=slot;D.activeSlot=null;D.opts=null;
  if(reconcileDraftState()){
    D.done=true; /* stay on the court \u2014 no summary screen */
    const o=teamOVR(D.roster),pr=projection(o.eff);
    if(!DRAFT_ERA&&o.total>HS.draft.ovr){HS.draft.ovr=o.total;HS.draft.wins=pr.wins;saveHS();} /* era runs don't set the all-time best */
    T.stats.drafts++;trophyRoster("draft",D.roster,{eraLocked:!!DRAFT_ERA});confetti(80);
    if(typeof creditsForRun==="function"){creditsForRun("draft");if(!DRAFT_ERA)creditsForRecord(pr.wins);}
  }
  render(); /* re-render snaps the card in + relights the chemistry web */
}
/* post-completion rearrangement: tap any player, then send them to any slot
   they're eligible for. The player currently in the destination drops into the
   tapped player's old slot. Starter slots need a position match; the bench takes
   anyone \u2014 so moving a starter down is always legal, and moving a bench player up
   is allowed into any starter slot their position fits. */
function openDraftSwap(slot){
  const cur=DB[D.roster[slot]];
  const fromBench=BENCH_SLOTS.includes(slot);
  /* A starter destination is only offered when the swap is legal BOTH ways:
     the mover fits the destination AND the occupant fits this vacated slot.
     (Bench slots accept anyone, so a bench origin/target always fits.) */
  const canLand=(mover,dest)=>BENCH_SLOTS.includes(dest)||eligible(mover,dest);
  const legalStarter=s2=>{
    if(s2===slot)return false;
    const occ=DB[D.roster[s2]];
    return canLand(cur,s2)&&canLand(occ,slot); /* two-way check */
  };
  const starterDests=STARTER_SLOTS.filter(legalStarter);
  const rows=starterDests.map(s2=>{
    const occ=DB[D.roster[s2]];
    return `<button class="btn gold" onclick="doDraftSwap('${slot}','${s2}')">
      <span>Start at ${SLOT_LABEL[s2]}</span>
      <small style="color:var(--dim)">swaps with ${esc(occ.name)} ${occ.ovr}</small></button>`;
  }).join("");
  /* bench action for a starter: prefer an OPEN bench spot (pure move, no displacement);
     otherwise swap with the bench player who can legally start this slot, if any. */
  let benchRow="";
  if(!fromBench){
    const open=BENCH_SLOTS.find(s2=>D.roster[s2]==null);
    if(open!=null){
      benchRow=`<button class="btn" onclick="doDraftSwap('${slot}','${open}')"><span>Move to bench</span></button>`;
    }else{
      /* find a bench player who can start the vacated slot (so the swap is legal) */
      const t=BENCH_SLOTS.find(s2=>eligible(DB[D.roster[s2]],slot));
      if(t!=null){const occ=DB[D.roster[t]];
        benchRow=`<button class="btn" onclick="doDraftSwap('${slot}','${t}')"><span>Move to bench</span><small style="color:var(--dim)">swaps with ${esc(occ.name)} ${occ.ovr}</small></button>`;}
    }
  }else{
    /* from bench: offer starting at any slot this player fits whose occupant can bench (always true) */
  }
  const any=rows||benchRow;
  const none=any?"":`<div class="who" style="color:var(--dim)">No legal moves \u2014 nobody else can cover ${SLOT_LABEL[slot]} and ${esc(cur.name)} only fits ${cur.positions.join("/")}.</div>`;
  $("#sheet").innerHTML=`<div class="sheetbox"><h3>Move \u00b7 ${esc(cur.name)} ${cur.ovr}</h3>
    <div class="who">${fromBench?"On the bench":"Starting at "+SLOT_LABEL[slot]}. Only legal moves are shown \u2014 whoever's there trades places.</div>
    <div class="swaprows">${rows}${benchRow}</div>${none}<button class="btn" onclick="closeSheet()">Cancel</button></div>`;
  $("#sheet").classList.add("show");
  $("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet();};
}
function doDraftSwap(a,b){
  const pa=DB[D.roster[a]],pb=DB[D.roster[b]];
  /* legal if the moving player fits the destination and the displaced player fits
     the vacated slot (bench always fits, so moving up from bench is fine) */
  if(!eligible(pa,b)||!eligible(pb,a)){notice("Those positions don't fit.");return;}
  [D.roster[a],D.roster[b]]=[D.roster[b],D.roster[a]];
  D.lastSlot=b;closeSheet();
  const o=teamOVR(D.roster),pr=projection(o.eff);
  if(!DRAFT_ERA&&o.total>HS.draft.ovr){HS.draft.ovr=o.total;HS.draft.wins=pr.wins;saveHS();}

}

const IMG_TIER={Icon:{ink:"#ff7ac8",glow:26},Elite:{ink:"#ff4d6d",glow:14},Gold:{ink:"#ffc53d",glow:8},Silver:{ink:"#c9ccd3",glow:0},Bronze:{ink:"#b0793f",glow:0}};

  const c=IMG_CTX,f=s=>(weight?weight+" ":"")+s+"px Arial";

function imgClip(txt,maxW){ /* call with the final font already set */

function imgCard(p,cx,cy,w,h){

  c.restore();
  c.restore();

/* art image cache for the share canvas (slug -> loaded Image) */
const IMG_ART={};
function preloadRosterArt(roster){
  const slugs=[...new Set(ALL_SLOTS.map(s=>roster[s]).filter(id=>id!=null).map(id=>cardSlugFor(DB[id])).filter(s=>CARD_ART.has(s)))];
  return Promise.all(slugs.map(s=>new Promise(done=>{
    if(IMG_ART[s]){done();return;}
    let i=0; /* walk the same extension variants the HTML cards use */
    const tryNext=()=>{
      if(i>=CARD_ART_EXTS.length){done();return;} /* none found — initials on the export */
      const im=new Image();im.crossOrigin="anonymous"; /* keeps the canvas exportable */
      im.onload=()=>{IMG_ART[s]=im;done();};
      im.onerror=()=>{i++;tryNext();};
      im.src=CARD_ART_BASE+s+CARD_ART_EXTS[i];
    };
    tryNext();
  })));
}

    <p>You may opt out of personalized advertising by visiting Google's Ads Settings

  o.classList.add("show");

}

/* neon squad web: blue lines between starters sharing a chemistry tag or team core */
const WEB_COLORS={team:"#ffc53d",duo:"#ff4d6d",story:"#ff7ac8",era:"#35d6ff",style:"#39ff9c"};
/* glow strength ascends with chemistry rank */
/* layered stroke bloom per rank — painted directly into the web (no CSS filters,
   which iOS Safari drops on SVG children). Widest soft halo → mid glow → crisp core,
   ascending strength by rank, same soft-rim feel as the Icon cards. */
/* uniform neon bloom for all lit segments (Icon-rim style, per-link color)
   via SVG-native feGaussianBlur — renders on every browser incl. iOS Safari. */
function pairLinkKind(a,b){ /* strongest shared chemistry between two starters */
  if(a.name===b.name)return null; /* two versions of one player never link */
  if(a.team===b.team)return "team";
  if(DUO_PAIRS.has(a.name+"|"+b.name))return "duo";
  let era=false,style=false;
  for(const t of a.tags){if(!b.tags.includes(t))continue;
    if(t.startsWith("Story_"))return "story";
    if(t.startsWith("Era_"))era=true;else style=true;}
  return era?"era":style?"style":null;
}
function pairLinked(a,b){return !!pairLinkKind(a,b);}
function drawSquadWeb(){
  const svg=$(".squadweb");if(!svg)return;
  const court=svg.closest(".court"),cr=court.getBoundingClientRect();
  if(cr.width)svg.setAttribute("viewBox",`0 0 ${cr.width} ${cr.height}`);
  const roster=screen==="draft"?D.roster:screen==="daily"?(DD?DD.roster:emptyRoster()):screen==="share"&&SHARED?SHARED.roster:S[sideFor(screen)].roster;
  const pts={};
  STARTER_SLOTS.forEach(s=>{const el=court.querySelector(".slot-"+s);if(!el)return;
    const r=el.getBoundingClientRect();
    pts[s]={x:r.left-cr.left+r.width/2,y:r.top-cr.top+r.height/2};});
  const fw=(cr.width||600),fh=(cr.height||400);
  const defs=`<defs><filter id="webneon" filterUnits="userSpaceOnUse" x="-60" y="-60" width="${(fw+120).toFixed(0)}" height="${(fh+120).toFixed(0)}">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>`;
  let grey="",blue="";
  for(let i=0;i<STARTER_SLOTS.length;i++)for(let j=i+1;j<STARTER_SLOTS.length;j++){
    const A=STARTER_SLOTS[i],B=STARTER_SLOTS[j],p1=pts[A],p2=pts[B];
    if(!p1||!p2)continue;
    const seg=(cls,st)=>`<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}" ${st}/>`;
    grey+=seg("g",'stroke="#6b6b74" stroke-width="1.5" opacity="0.22"'); /* cool-grey web, always present */
    if(roster[A]!=null&&roster[B]!=null){
      const k=pairLinkKind(DB[roster[A]],DB[roster[B]]);
      if(k){const c=WEB_COLORS[k];
        blue+=seg("core-"+k,`class="core-${k}" stroke="${c}" stroke-width="3" opacity="0.9" stroke-linecap="round" filter="url(#webneon)"`);}
    }
  }
  svg.innerHTML=defs+grey+blue;
}
window.addEventListener("resize",()=>drawSquadWeb());
function initArena(){
  const a=$("#arena");if(!a)return;
  const cols=["#ffffff","#9fe8ff","#ffc4e6","#ffe9a3"];
  for(let i=0;i<26;i++){const s=document.createElement("div");s.className="spark";
    const sz=(1.5+Math.random()*2.5).toFixed(1);
    s.style.width=s.style.height=sz+"px";
    s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";
    s.style.background=cols[i%cols.length];
    s.style.animationDuration=(2.2+Math.random()*4)+"s";
    s.style.animationDelay=(Math.random()*5)+"s";
    a.appendChild(s);}
}
initArena();

if(__sh){SHARED=__sh;screen="share";}
render();
