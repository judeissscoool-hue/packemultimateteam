<meta name="twitter:description" content="Draft your all-time NBA dream team and chase the perfect 82-0 season.">
<style>
/* ============ TOKENS: arena at night ============ */
:root{
  --bg:#121212; --panel:#171717; --panel2:#131313; --line:rgba(255,255,255,.08);
  --ink:#f2f2f5; --dim:#9a9aa5; --cyan:#35d6ff; --amber:#f2a93b; --green:#39ff9c;
  --bronze:#c08552; --silver:#c7cedb; --gold:#ffc53d; --elite:#ff4d6d;
  --icon1:#ffd7ef; --icon2:#ff7ac8; --icon3:#ffffff;
  --disp:'Impact','Haettenschweiler','Arial Narrow Bold','Arial Black',sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100%}
body{background:
  radial-gradient(1200px 800px at 50% 0%, #1d1d1d 0%, #151515 45%, var(--bg) 100%);
  overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(70px);
  z-index:-1;pointer-events:none;opacity:.8}
body::before{width:560px;height:560px;left:-180px;top:12%;
  background:radial-gradient(circle,rgba(53,214,255,.10),transparent 65%);animation:drift1 26s ease-in-out infinite}
body::after{width:640px;height:640px;right:-220px;top:48%;
  background:radial-gradient(circle,rgba(255,122,200,.09),transparent 65%);animation:drift2 32s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(140px,-90px) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-160px,110px) scale(1.12)}}
#neonart{position:fixed;inset:0;z-index:-2;pointer-events:none}
#neonart svg{width:100%;height:100%;display:block}
#neonart .glow-cyan{color:var(--cyan);filter:drop-shadow(0 0 7px var(--cyan))}
#neonart .glow-pink{color:#ff5cb8;filter:drop-shadow(0 0 7px #ff5cb8)}
#neonart .glow-green{color:var(--green);filter:drop-shadow(0 0 7px var(--green))}
#arena{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#arena::before,#arena::after{content:"";position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  border-radius:50%;border:1.5px solid rgba(53,214,255,.08);animation:ringpulse 9s ease-in-out infinite}
#arena::before{width:78vmin;height:78vmin}
#arena::after{width:120vmin;height:120vmin;border-color:rgba(57,255,156,.07);animation-delay:-4.5s}
@keyframes ringpulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.7}50%{transform:translate(-50%,-50%) scale(1.06);opacity:1}}
.spark{position:absolute;border-radius:50%;opacity:0;animation:twinkle ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.85;transform:scale(1.4)}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,.disp{font-family:var(--disp);letter-spacing:.04em;text-transform:uppercase;font-weight:400}

/* ============ APP FRAME ============ */
#app{max-width:1180px;margin:0 auto;padding:12px 14px 90px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px 14px;flex-wrap:wrap}
.logo{font-family:var(--disp);font-size:26px;letter-spacing:.06em;text-transform:uppercase;line-height:.95}
.logo em{font-style:normal;color:var(--amber)}
.logo small{display:block;font-family:var(--body);font-size:10px;letter-spacing:.28em;color:var(--dim)}
.hs{font-size:11px;color:var(--dim);text-align:right;line-height:1.5}
.hs b{color:var(--gold);font-family:var(--disp);font-size:15px;letter-spacing:.05em}

nav.tabs{display:flex;gap:6px;position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:linear-gradient(to top,#121212 78%,rgba(18,18,18,0));padding:10px 14px 14px;justify-content:center}
nav.tabs button{flex:0 1 150px;padding:10px 8px;border-radius:10px;background:var(--panel);border:1px solid rgba(255,255,255,.08);
  font-family:var(--disp);letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--dim)}
nav.tabs button.on{color:#0c0c0c;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 18px rgba(53,214,255,.45)}

.panel{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.rowhead h2{font-size:18px;color:var(--ink)}
.rowhead .sub{font-size:11px;color:var(--dim)}
.btn{padding:9px 14px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--cyan);color:#0c0c0c;border-color:var(--cyan);font-family:var(--disp);letter-spacing:.06em;text-transform:uppercase}
.btn.danger{border-color:#5c2233;color:#ff8aa0}
.btn.gold{background:linear-gradient(135deg,#3a2f12,#241d0c);border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ============ SCOREBOARD (team OVR / chem / projection) ============ */
.scoreboard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
@media(max-width:820px){.scoreboard{grid-template-columns:auto 1fr}
  .chemlegend{grid-column:1/-1;border-left:none;border-top:1px solid rgba(255,255,255,.08);padding:10px 0 0;min-width:0;
    display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
  .chemlegend .clg-h{grid-column:1/-1}}
.ovrbig{font-family:var(--disp);font-size:64px;line-height:1;color:var(--gold);text-shadow:0 0 24px rgba(255,197,61,.35);min-width:110px;text-align:center;transition:transform .25s}
.ovrbig.bump{transform:scale(1.18)}
.ovrbig small{display:block;font-size:10px;letter-spacing:.3em;color:var(--dim);font-family:var(--body);margin-top:2px}
.ovrbig small.exact{color:var(--gold);letter-spacing:.14em;font-size:11.5px;margin-top:4px;text-shadow:0 0 8px rgba(255,197,61,.45)}
.projrow{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--dim)}
.projrow b{display:block;color:var(--ink);font-size:15px;font-family:var(--disp);letter-spacing:.05em}
.chemlinks{margin-top:6px;font-size:11px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap}
.chemlinks span{background:var(--panel2);border:1px solid var(--line);padding:2px 8px;border-radius:20px}

.recordid{margin-top:9px;border:1px solid rgba(255,255,255,.10);background:linear-gradient(135deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border-radius:10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;overflow:hidden;position:relative}
.recordid::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 0 42%,rgba(255,255,255,.05) 50%,transparent 58% 100%);transform:translateX(-120%)}
.recordid .rid-main{font-family:var(--disp);font-size:18px;letter-spacing:.07em;text-transform:uppercase;line-height:1}
.recordid .rid-sub{font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:4px}
.recordid .rid-record{font-family:var(--disp);font-size:24px;letter-spacing:.04em;white-space:nowrap}
.recordid.rid-playoff{border-color:rgba(53,214,255,.32)}
.recordid.rid-contender{border-color:rgba(255,197,61,.38);box-shadow:0 0 14px rgba(255,197,61,.08) inset}
.recordid.rid-great{border-color:rgba(255,122,200,.48);box-shadow:0 0 18px rgba(255,122,200,.10) inset}
.recordid.rid-near{border-color:rgba(242,169,59,.72);box-shadow:0 0 18px rgba(242,169,59,.16),0 0 20px rgba(242,169,59,.08) inset}
.recordid.rid-near .rid-main,.recordid.rid-near .rid-record{color:var(--amber)}
.recordid.rid-perfect{border:1px solid var(--gold);background:linear-gradient(135deg,#3a2f12,#1b1609 58%,#33250d);box-shadow:0 0 24px rgba(255,197,61,.34),0 0 30px rgba(255,197,61,.18) inset;animation:clubpulse 1.8s ease-in-out infinite}
.recordid.rid-perfect::after{animation:clubshine 2.8s ease-in-out infinite}
.recordid.rid-perfect .rid-main,.recordid.rid-perfect .rid-record{color:var(--gold);text-shadow:0 0 12px rgba(255,197,61,.5)}
.recordid.rid-perfect .rid-sub{color:#f9dfa0}
@keyframes clubpulse{0%,100%{box-shadow:0 0 20px rgba(255,197,61,.25),0 0 28px rgba(255,197,61,.12) inset}50%{box-shadow:0 0 32px rgba(255,197,61,.46),0 0 38px rgba(255,197,61,.22) inset}}
@keyframes clubshine{0%,30%{transform:translateX(-120%)}65%,100%{transform:translateX(120%)}}
.clubstamp{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--gold);border-radius:999px;padding:5px 10px;background:#2b210b;color:var(--gold);font-family:var(--disp);font-size:12px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 0 16px rgba(255,197,61,.25)}
:root{--ck-team:#ffc53d;--ck-duo:#ff4d6d;--ck-story:#ff7ac8;--ck-era:#35d6ff;--ck-style:#39ff9c}
/* chem web segments: icon-rim style bloom, strength ascends with rank */
.squadweb .wl{stroke-linecap:round;animation:webpulse var(--ws,2s) ease-in-out infinite}
.wl-style{stroke-width:2.6;--wo:.6;--wo2:.78;--ws:2.6s;
  filter:drop-shadow(0 0 3px var(--ck-style))}
.wl-era{stroke-width:2.8;--wo:.66;--wo2:.85;--ws:2.2s;
  filter:drop-shadow(0 0 4px var(--ck-era)) drop-shadow(0 0 9px rgba(53,214,255,.45))}
.wl-story{stroke-width:3.4;--wo:.75;--wo2:.95;--ws:1.7s;
  filter:drop-shadow(0 0 6px var(--ck-story)) drop-shadow(0 0 14px rgba(255,122,200,.65))}
.wl-team{stroke-width:4;--wo:.82;--wo2:1;--ws:1.3s;
  filter:drop-shadow(0 0 7px var(--ck-team)) drop-shadow(0 0 18px rgba(255,197,61,.75)) drop-shadow(0 0 30px rgba(255,197,61,.35))}
@keyframes webpulse{0%,100%{opacity:var(--wo,.8)}50%{opacity:var(--wo2,1)}}
.chemlinks span.hot{border-color:var(--amber);color:var(--amber)}
.chemlinks span.story{border-color:#ff7ac8;color:#ffb3e0}
.chemlinks span.ck-team{border-color:var(--ck-team);color:var(--ck-team)}
.chemlinks span.ck-duo{border-color:var(--ck-duo);color:#ff98a8}
.chemlinks span.ck-story{border-color:var(--ck-story);color:#ffb3e0}
.chemlinks span.ck-depth{border-color:var(--green);color:var(--green)}
.chemlinks span.ck-era{border-color:var(--ck-era);color:#8ee6ff}
.chemlinks span.ck-style{border-color:var(--ck-style);color:#8fffc8}
.chemlegend{border-left:1px solid rgba(255,255,255,.08);padding-left:14px;display:flex;flex-direction:column;gap:6px;min-width:200px}
.clg-h{font-size:9px;letter-spacing:.28em;color:var(--dim)}
.clg{display:flex;gap:8px;align-items:flex-start}
.clg i{width:16px;height:3px;border-radius:2px;margin-top:5px;flex:0 0 auto}
.clg.ck-team i{background:var(--ck-team);box-shadow:0 0 10px var(--ck-team),0 0 3px var(--ck-team)}
.clg.ck-story i{background:var(--ck-story);box-shadow:0 0 7px var(--ck-story)}
.clg.ck-era i{background:var(--ck-era);box-shadow:0 0 4px var(--ck-era)}
.clg.ck-style i{background:var(--ck-style);box-shadow:0 0 2.5px var(--ck-style)}
.clg b{font-size:10.5px;display:block;letter-spacing:.04em}
.clg.ck-team b{color:var(--ck-team)}.clg.ck-duo b{color:var(--ck-duo)}.clg.ck-story b{color:var(--ck-story)}
.clg.ck-era b{color:var(--ck-era)}.clg.ck-style b{color:var(--ck-style)}
.clg span{font-size:8.5px;color:var(--dim);line-height:1.35;display:block}


.near82{margin-top:9px;padding:8px 11px;border:1px solid var(--elite);border-radius:9px;background:linear-gradient(135deg,rgba(255,77,109,.14),rgba(242,169,59,.08));color:#ff9cad;font-family:var(--disp);font-size:15px;letter-spacing:.08em;text-align:center;text-transform:uppercase;box-shadow:0 0 15px rgba(255,77,109,.16)}
.near82 b{color:var(--gold);font-size:18px;text-shadow:0 0 10px rgba(255,197,61,.35)}
.near82.hit{border-color:var(--green);color:var(--green);background:rgba(57,255,156,.08);box-shadow:0 0 18px rgba(57,255,156,.18)}

/* ============ COURT ROSTER ============ */
.court{position:relative;border:1px solid rgba(255,255,255,.09);border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,rgba(24,24,24,.9) 0%,rgba(17,17,17,.9) 100%);padding:18px 10px 14px;margin-top:12px}
.court::before{content:"";position:absolute;left:50%;top:-90px;transform:translateX(-50%);
  width:340px;height:340px;border-radius:50%;border:2px solid rgba(57,255,156,.12);pointer-events:none}
.court::after{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:2px;height:100%;background:rgba(255,255,255,.05);pointer-events:none}
.court h3{position:relative;text-align:center;font-size:12px;letter-spacing:.3em;color:var(--dim);margin-bottom:10px;z-index:2}
.squadweb{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.fiveslots,.benchrow,.benchlabel{position:relative;z-index:2}
.fiveslots{position:relative;display:grid;grid-template-areas:". c ." "f1 . f2" "g1 . g2";
  grid-template-columns:1fr 1fr 1fr;gap:8px;justify-items:center}
.slot-C{grid-area:c}.slot-PF{grid-area:f1}.slot-SF{grid-area:f2}.slot-SG{grid-area:g1}.slot-PG{grid-area:g2}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.pickgrid .card{width:100%}
.coll .c3d,.pickgrid .c3d,.draftopts .c3d,.coll .flame,.pickgrid .flame,.draftopts .flame{width:100%}
.benchrow{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.benchlabel{width:100%;text-align:center;font-size:10px;letter-spacing:.3em;color:var(--dim);margin-top:12px}

/* ============ CARDS ============ */
.slot.slotlocked{opacity:.42;border-style:dotted;cursor:not-allowed}
.slot{width:104px;min-height:148px;border:1.5px dashed var(--line);border-radius:12px;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--dim);
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;background:rgba(10,10,10,.45);position:relative;transition:all .18s;font-family:var(--body)}
.slot .postag{font-family:var(--disp);font-size:18px;letter-spacing:.1em;color:#4a4a52}
.slot.eligible{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(53,214,255,.35);animation:pulse 1s infinite}
.blocked{opacity:.35}
.droptarget{outline:2px dashed var(--cyan);outline-offset:3px;border-radius:14px}
.dragsrc{opacity:.45}
.fromtag{position:absolute;top:5px;left:6px;font-size:8px;background:var(--amber);color:#0c0c0c;font-weight:800;border-radius:8px;padding:1px 5px;letter-spacing:.05em}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(53,214,255,.25)}50%{box-shadow:0 0 20px rgba(53,214,255,.6)}}

.card{width:104px;height:158px;border-radius:12px;padding:7px 7px 6px;position:relative;display:flex;flex-direction:column;
  background:var(--panel2);border:1.5px solid var(--line);user-select:none;cursor:pointer;overflow:hidden;transition:transform .12s}
.card:active{transform:scale(.96)}
/* ---- card art layer ----
   The art lives in .cardartwrap so it can be clipped to the PLATE rather than the
   whole card. Full-bleed art would otherwise paint straight over the frame band
   (.efxframe z0) and the energy/sheen riding it (z1), making every equipped frame
   and effect invisible on any card that has artwork. */
.card.hasart{background:#0a0a0a}
.cardartwrap{position:absolute;inset:0;z-index:0;pointer-events:none}
.cardart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:0;display:block}
.cardart-fade{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(0,0,0,.15) 0%,rgba(0,0,0,0) 32%,rgba(0,0,0,.55) 70%,rgba(0,0,0,.9) 100%)}
/* top-left scrim: keeps the OVR + positions legible over light artwork */
.cardart-scrim{position:absolute;top:0;left:0;width:78%;height:46%;z-index:1;pointer-events:none;
  background:radial-gradient(120% 110% at 0% 0%,rgba(0,0,0,.82) 0%,rgba(0,0,0,.55) 38%,rgba(0,0,0,0) 72%)}
.card.hasart .card-top,.card.hasart .infobtn,.card.hasart .nm,.card.hasart .meta{position:relative;z-index:2}
/* art cards: keep each tier's own OVR colour/gradient intact. text-shadow can't render
   on gradient-clipped text (Icon uses background-clip:text + transparent colour), so use
   a drop-shadow FILTER — it works for both solid-colour and gradient OVRs. */
.card.hasart .ovr{font-size:29px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.95)) drop-shadow(0 0 2px rgba(0,0,0,.85))}
.card.hasart .pos{color:#f2f2f6;font-weight:700;text-shadow:0 1px 5px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9)}
.card.hasart .infobtn{top:5px;right:5px;background:rgba(0,0,0,.55);border-color:rgba(255,255,255,.35);color:#fff}
.card.hasart .nm{text-shadow:0 1px 6px rgba(0,0,0,.95)}
.card.hasart .meta{color:#d8d8e0;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.card .ovr{font-family:var(--disp);font-size:26px;line-height:1;letter-spacing:.02em}
.card .pos{letter-spacing:.08em;color:var(--dim);white-space:nowrap}
.card .ini{margin:4px auto 2px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:17px;background:#0d0d0d;border:1.5px solid var(--line);letter-spacing:.02em}
.card .nm{font-size:10.5px;font-weight:700;text-align:center;line-height:1.15;margin-top:auto;min-height:24px;display:flex;align-items:center;justify-content:center}
.card .meta{font-size:8px;color:var(--dim);text-align:center;letter-spacing:.06em;margin-top:2px}
/* ---- 3D flip structure ---- */
.c3d{perspective:800px;position:relative}
.c3din{position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.c3din.flipped3{transform:rotateY(180deg)}
.c3face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.c3front{position:relative}
.c3back{position:absolute;inset:0;transform:rotateY(180deg)}
.infobtn{position:absolute;top:4px;right:5px;width:17px;height:17px;border-radius:50%;z-index:5;
  font-size:11px;line-height:15px;text-align:center;color:var(--dim);
  border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.4);padding:0}
.infobtn:hover{color:var(--cyan);border-color:var(--cyan)}
.cardback{width:100%;height:100%;border-radius:12px;background:#121212;border:1.5px solid rgba(255,255,255,.14);
  padding:8px 8px 6px;display:flex;flex-direction:column;gap:2px;cursor:pointer;overflow:hidden;text-align:left}
.cardback .bk-nm{font-family:var(--disp);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.cardback .bk-sub{font-size:7px;color:var(--dim);margin-bottom:2px}
.cardback .bk-lab{font-size:6.2px;letter-spacing:.22em;text-transform:uppercase;color:#6f6f78;margin-top:3px}
.cardback .bk-val{font-size:7.6px;line-height:1.35;color:var(--ink)}
.cardback .bk-flip{margin-top:auto;font-size:6.5px;letter-spacing:.15em;color:#6f6f78;text-align:center}
.bk-Bronze{border-color:var(--bronze)}.bk-Bronze .bk-nm{color:var(--bronze)}
.bk-Silver{border-color:var(--silver)}.bk-Silver .bk-nm{color:var(--silver)}
.bk-Gold{border-color:var(--gold)}.bk-Gold .bk-nm{color:var(--gold)}
.bk-Elite{border-color:var(--elite)}.bk-Elite .bk-nm{color:var(--elite)}
.bk-Icon{border-color:var(--icon2)}.bk-Icon .bk-nm{color:#ffc4e6}
.card .cnt{position:absolute;top:5px;left:6px;font-size:9px;background:var(--cyan);color:#06121a;font-weight:800;border-radius:8px;padding:1px 5px}

.t-Bronze{border-color:var(--bronze)} .t-Bronze .ovr{color:var(--bronze)} .t-Bronze .ini{border-color:var(--bronze)}
.t-Silver{border-color:var(--silver);background:linear-gradient(160deg,#202024,#131316)} .t-Silver .ovr{color:var(--silver)} .t-Silver .ini{border-color:var(--silver)}
.t-Gold{border-color:var(--gold);background:linear-gradient(160deg,#241d0a,#141210);box-shadow:0 0 10px rgba(255,197,61,.18)}
.t-Gold .ovr{color:var(--gold)} .t-Gold .ini{border-color:var(--gold)}
.t-Elite{border-color:var(--elite);background:linear-gradient(160deg,#2a0f1a,#150b12);box-shadow:0 0 14px rgba(255,77,109,.3)}
.t-Elite .ovr{color:var(--elite)} .t-Elite .ini{border-color:var(--elite);box-shadow:0 0 10px rgba(255,77,109,.5) inset}
.t-Icon{border:2px solid transparent;background:
  linear-gradient(160deg,#241322,#160d18) padding-box,
  linear-gradient(120deg,var(--icon2),var(--icon3),var(--icon1),var(--icon2)) border-box;
  box-shadow:0 0 22px rgba(255,140,205,.55)}
.t-Icon .ovr{background:linear-gradient(180deg,#ffffff,var(--icon2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card.hasart.t-Icon .ovr{background:linear-gradient(180deg,#ffffff,#ff7ac8);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-Icon .ini{border-color:var(--icon2);background:#2a1526;color:#ffd7ef}
.t-Icon::after{content:"";position:absolute;top:-60%;left:-60%;width:70%;height:220%;transform:rotate(22deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);animation:sheen 3.2s infinite}
@keyframes sheen{0%{left:-70%}55%{left:130%}100%{left:130%}}
/* pink flame aura wrapping every Icon card */
.flame{position:relative;z-index:0;border-radius:14px}
.flame::before,.flame::after{content:"";position:absolute;z-index:-1;border-radius:18px;pointer-events:none}
.flame::before{inset:-9px;filter:blur(11px);opacity:.75;
  background:conic-gradient(from 0deg,#ff5cb8,#fff,#ff9ad5,#ff2fa4,#ffd7ef,#ff5cb8);
  animation:flamespin 3.2s linear infinite,flick 1.1s ease-in-out infinite}
.flame::after{inset:-4px;filter:blur(4px);opacity:.55;
  background:conic-gradient(from 180deg,#fff,#ff7ac8,#fff0f9,#ff4db0,#fff);
  animation:flamespin 2.1s linear infinite reverse,flick .7s ease-in-out infinite}
@keyframes flamespin{to{transform:rotate(360deg)}}
@keyframes flick{0%,100%{opacity:.55;transform:scale(1) rotate(0)}50%{opacity:.95;transform:scale(1.05)}}

/* ============ COLLECTION ============ */

#bigreveal .xlwrap{animation:spinout 1.15s cubic-bezier(.22,.9,.3,1.05) both;transform-style:preserve-3d}
@keyframes spinout{0%{transform:scale(.12) rotateY(0deg);opacity:0}
  15%{opacity:1}70%{transform:scale(1.28) rotateY(900deg)}100%{transform:scale(1.12) rotateY(1080deg)}}

@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.pullmsg{font-family:var(--disp);font-size:26px;letter-spacing:.1em;color:var(--gold);text-shadow:0 0 20px rgba(255,197,61,.6);min-height:32px;text-align:center}

/* ============ ACTION SHEET / MODALS ============ */
#sheet{position:fixed;inset:0;background:rgba(5,5,5,.75);z-index:55;display:none;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
.sheetbox{background:#161616;border:1px solid rgba(255,255,255,.09);border-bottom:none;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;

/* ============ DRAFT ============ */
.draftopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;max-width:640px;margin:12px auto}

@keyframes snapin{0%{transform:rotateY(90deg) scale(.55);opacity:0}60%{transform:rotateY(-12deg) scale(1.06);opacity:1}100%{transform:rotateY(0) scale(1)}}
/* ---- fullscreen drafting center ---- */
#draftoverlay{position:fixed;inset:0;background:rgba(6,6,6,.95);z-index:58;display:none;
  flex-direction:column;align-items:center;justify-content:center;overflow-y:auto}

#draftoverlay h2{font-family:var(--disp);font-size:22px;letter-spacing:.12em;text-transform:uppercase;text-align:center}

.captainwrap .card{width:clamp(84px,26vw,112px);height:auto;aspect-ratio:104/158}
@keyframes dropIn{from{transform:translateY(-64px);opacity:0}to{transform:translateY(0);opacity:1}}
.dropin{animation:dropIn .62s cubic-bezier(.25,.8,.3,1) both}
/* Icon options spin out like a pack pull instead of fading in */
@keyframes spinIn{0%{transform:scale(.15) rotateY(0deg);opacity:0}
  15%{opacity:1}70%{transform:scale(1.16) rotateY(900deg)}100%{transform:scale(1) rotateY(1080deg)}}
.spindrop{animation:spinIn .95s cubic-bezier(.22,.9,.3,1.05) both;transform-style:preserve-3d}
.captainwrap{perspective:900px}
.snapin{animation:snapin .45s cubic-bezier(.25,.9,.3,1.15) both;transform-style:preserve-3d}
.pickhdr{text-align:center;margin:6px 0 2px}

.draftmini span.done{border-color:var(--gold);color:var(--gold);font-weight:700}

.modes{max-width:920px;margin:6px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.modehero{grid-column:1/-1;text-align:center;padding:14px 0 4px}

#policyoverlay{position:fixed;inset:0;background:rgba(6,6,6,.96);z-index:59;display:none;
  align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 14px 90px}

  border-radius:16px;padding:26px 24px;line-height:1.7}

.policybox .p-date{font-size:10.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.policybox h3{font-size:14px;color:var(--cyan);margin:16px 0 4px;letter-spacing:.06em}
.policybox p{font-size:12.5px;color:#c9c9d2;margin-bottom:6px}
.policybox p b{color:var(--ink)}
.policybox .p-note{font-size:11px;color:var(--dim);border-top:1px solid rgba(255,255,255,.08);
  margin-top:16px;padding-top:12px;margin-bottom:14px}
.foot{margin:26px auto 4px;text-align:center;font-size:10.5px;color:#77777f;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}

.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.grid2{grid-template-columns:minmax(420px,460px) minmax(0,1fr)}}
/* v35: the Pack Mode scoreboard lives inside the sidebar, so it needs its own
   compact layout instead of inheriting the full-width three-column scoreboard. */
.hub-scoreboard{grid-template-columns:104px minmax(0,1fr);align-items:start;gap:12px}
.hub-scoreboard>div:nth-child(2){min-width:0}
.hub-scoreboard .projrow{gap:10px}
.hub-scoreboard .recordid{min-width:0}
.hub-scoreboard .recordid .rid-main{font-size:15px;overflow-wrap:anywhere}
.hub-scoreboard .recordid .rid-sub{font-size:8px;letter-spacing:.10em;overflow-wrap:anywhere}
.hub-scoreboard .recordid .rid-record{font-size:20px}
.hub-scoreboard .chemlegend{grid-column:1/-1;border-left:0;border-top:1px solid rgba(255,255,255,.08);padding:10px 0 0;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
.hub-scoreboard .chemlegend .clg-h{grid-column:1/-1}

}
@media(max-width:899px){
  .hub-scoreboard{grid-template-columns:auto 1fr}
  .hub-scoreboard .chemlegend{grid-column:1/-1}
}
@media(max-width:520px){
  .slot,.card{width:88px}.card{height:146px}.slot{min-height:134px}
  .ovrbig{font-size:48px;min-width:84px}
  nav.tabs button{font-size:11px;padding:9px 4px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

.trophyhero h2{font-size:28px;color:var(--gold)}.tpbig{font-family:var(--disp);font-size:34px;color:var(--gold);text-align:right}.tpbig small{display:block;font:10px var(--body);letter-spacing:.18em;color:var(--dim)}
.trophyfilters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.trophyfilters button{padding:7px 10px;border:1px solid var(--line);border-radius:20px;font-size:10px;letter-spacing:.08em;color:var(--dim);background:var(--panel2)}.trophyfilters button.on{color:#071217;background:var(--cyan);border-color:var(--cyan)}
.trophygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}.trophy{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;min-height:142px;position:relative;overflow:hidden}.trophy.done{border-color:rgba(255,197,61,.55);box-shadow:0 0 16px rgba(255,197,61,.10) inset}.trophy.hidden:not(.done){filter:saturate(.35)}

.t-BronzeT{border-top:3px solid var(--bronze)}.t-SilverT{border-top:3px solid var(--silver)}.t-GoldT{border-top:3px solid var(--gold)}.t-DiamondT{border-top:3px solid var(--cyan)}.t-ImmortalT{border-top:3px solid var(--icon2);box-shadow:0 0 18px rgba(255,122,200,.14)}
.archivegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.archive{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px}.archive.complete{border-color:var(--green)}.archive.activated{border-color:var(--gold);box-shadow:0 0 13px rgba(255,197,61,.12)}.archive h3{font-size:16px}.archive .members{font-size:10px;color:#c9c9d2;line-height:1.6;margin-top:5px}.member.ok{color:var(--green)}.member.miss{color:#ff8aa0}.archive .state{font-size:9px;letter-spacing:.12em;color:var(--dim);margin-top:8px}.archivetabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.archivetabs .btn.on{border-color:var(--gold);color:var(--gold)}
.unlocktoast{position:fixed;right:14px;top:14px;z-index:120;width:min(340px,calc(100vw - 28px));background:#17130a;border:1px solid var(--gold);border-radius:14px;padding:14px;box-shadow:0 0 28px rgba(255,197,61,.32);animation:toastin .35s ease-out}.unlocktoast b{color:var(--gold);font-family:var(--disp);letter-spacing:.05em}.unlocktoast span{display:block;font-size:11px;color:#d5d1c6;margin-top:4px}@keyframes toastin{from{transform:translateY(-20px);opacity:0}}

/* ===== Eras Mode ===== */

.collbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#7dffc0);border-radius:99px;transition:width .4s ease}
.colltabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.ctab{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:99px;
  padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.ctab span{font-size:10px;opacity:.75}
.ctab.on{color:#0b0b0d;background:var(--ink);border-color:var(--ink)}
.ctab.ct-Icon.on{background:var(--icon2);border-color:var(--icon2)}
.ctab.ct-Elite.on{background:#ff5d6e;border-color:#ff5d6e}
.ctab.ct-Gold.on{background:var(--gold);border-color:var(--gold)}
.collsearch{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);
  padding:10px 12px;font-size:13px;margin-bottom:8px}
.collsearch:focus{outline:none;border-color:var(--cyan)}
.collcount{font-size:11px;letter-spacing:.1em;color:var(--dim);margin-bottom:8px}
.draftctl{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:14px}
.draftctl-note{font-size:11px;letter-spacing:.09em;color:var(--dim)}

/* ---- collection: filter the grid by a cosmetic you own ---- */
.collfilters{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.collfilters .collsearch{flex:1 1 190px;margin-bottom:0}
.collefx{flex:1 1 200px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  color:var(--ink);padding:10px 12px;font-size:13px;font-family:inherit;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.collefx:focus{outline:none;border-color:var(--cyan)}
.collefx.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(53,214,255,.22)}
.collefx option,.collefx optgroup{background:var(--panel);color:var(--ink)}
.collchip{display:flex;align-items:center;gap:9px;margin-bottom:8px;padding:8px 10px;border-radius:10px;
  background:rgba(53,214,255,.08);border:1px solid rgba(53,214,255,.34)}
.collchip b{font-family:var(--disp);font-size:14px;letter-spacing:.06em;color:var(--cyan)}
.collchip span{font-size:11px;letter-spacing:.08em;color:var(--dim)}
.collchip button{margin-left:auto;width:24px;height:24px;border-radius:50%;color:var(--dim);font-size:16px;
  line-height:1;border:1px solid var(--line);background:var(--panel2)}
.collchip button:hover{color:var(--cyan);border-color:var(--cyan)}
.colltabs.dim{opacity:.42}
.collgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ctile{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#1c1c23,#101014);
  border:1.5px solid var(--line);cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end}
.ctile .ct-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.ctile:before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(to bottom,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 68%,rgba(0,0,0,.92) 100%)}
.ct-ovr{position:absolute;top:5px;left:7px;z-index:2;font-family:var(--disp);font-size:17px;line-height:1;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.95))}
.ct-meta{position:relative;z-index:2;padding:6px 7px 7px;text-align:center}
.ct-meta b{display:block;font-size:10px;line-height:1.15;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-meta span{display:block;font-size:8px;letter-spacing:.06em;color:#b6b6c0;margin-top:2px}
.ctile.t-Icon{border-color:var(--icon2)}.ctile.t-Icon .ct-ovr{color:var(--icon2)}
.ctile.t-Elite{border-color:#ff5d6e}.ctile.t-Elite .ct-ovr{color:#ff5d6e}
.ctile.t-Gold{border-color:var(--gold)}.ctile.t-Gold .ct-ovr{color:var(--gold)}
.ctile.t-Silver{border-color:#9aa4b2}.ctile.t-Silver .ct-ovr{color:#c3cbd6}
.ctile.t-Bronze{border-color:#a97042}.ctile.t-Bronze .ct-ovr{color:#c99160}
.ctile.locked{border-style:dashed;border-color:rgba(255,255,255,.13);background:#0d0d10;cursor:default;align-items:center;justify-content:center}
.ctile.locked:before{display:none}
.ct-q{font-family:var(--disp);font-size:30px;color:rgba(255,255,255,.13)}
.ctile.locked .ct-meta b{color:rgba(255,255,255,.18);letter-spacing:.12em}
.ctile.locked .ct-meta span{color:rgba(255,255,255,.13)}
.cempty{grid-column:1/-1;text-align:center;color:var(--dim);font-size:12px;padding:26px 0}
@media(max-width:560px){.collbig{margin-left:0;text-align:left;font-size:28px}
  .collgrid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}}

/* =========================================================
   UNIFIED CARD FRAME
   Every card now has a real frame band. Standard cards get a rectangular
   band; equipped frames just change its shape. The band carries the tier
   gradient, and an opaque inner plate covers everything inside it — which
   is what makes energy sheens read as a border instead of washing over
   the whole card on initials-only cards.
   Stack inside .card:
     0 .efxframe  band, tier gradient (or effect colour)
     1 .efxenergy / .efxsheen   ride the band
     2 .efxplate  OPAQUE inner plate — masks the middle
     3 art  4 fade/scrim  4 initials  5 overlay  6 type
   ========================================================= */
.card.framed{background:transparent!important;border:none!important;padding:9px 9px 8px}
/* a shaped frame must not leave the card's own rounded rectangle showing behind it */
.card[class*="f-"]{background:transparent!important;border:none!important;
  box-shadow:none!important;border-radius:0!important}
/* Per-shape padding AND type scaling. A silhouette that tapers (Shield) or pinches
   (Obelisk) has far less usable width low down, so the name/meta block is lifted and
   shrunk to sit inside the wide part of the shape. */
.card.f-shield{padding:10px 20px 42px}
.card.f-shield .nm{font-size:9px;min-height:18px;line-height:1.1}
.card.f-shield .meta{font-size:7px;letter-spacing:.04em}
.card.f-shield .ini{width:38px;height:38px;font-size:15px;margin:4px auto 2px}

.card.f-crown {padding:22px 12px 9px}
.card.f-crown .nm{font-size:9.5px;min-height:20px}
.card.f-crown .meta{font-size:7.5px}

.card.f-obel  {padding:22px 17px 22px}
.card.f-obel .nm{font-size:9px;min-height:18px;line-height:1.1}
.card.f-obel .meta{font-size:7px;letter-spacing:.03em}
.card.f-obel .ini{width:40px;height:40px;font-size:16px}

.card.f-rune  {padding:11px 12px 20px}
.card.f-rune .nm{font-size:9.5px;min-height:20px}
.card.f-rune .meta{font-size:7.5px}

.card.f-deco  {padding:15px 13px 15px}
.card.f-deco .nm{font-size:9.5px;min-height:20px}
.card.f-deco .meta{font-size:7.5px}

.card.f-vault {padding:12px 13px 12px}
.card.f-vault .meta{font-size:8px}

.card.f-notch {padding:14px 10px 15px}
.card.f-blade {padding:10px 12px 14px}
.card.f-chamf {padding:11px 11px 11px}
/* the meta line is the one that overflows first — never let it wrap out of shape */
.card[class*="f-"] .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card[class*="f-"] .nm{overflow:hidden}
/* Standard = a rectangular frame, defined the same way every shaped frame is.
   clip-path (not overflow) is what actually contains the rotating energy children,
   so every frame including the default one must declare one. */
.card.framed .efxframe,.card.framed .efxplate,
.card.framed .efxsheen,.card.framed .efxenergy{clip-path:inset(0 round 12px)}
/* CRITICAL: these four are clipped to the card themselves. .card.has-aura sets
   overflow:visible so the aura halo can spill outside — without their own clip the
   rotating energy conic escapes with it and blobs out past the card edge. */
.efxframe,.efxplate,.efxsheen,.efxenergy{clip-path:inset(0 round 12px)}
.efxframe{position:absolute;inset:0;z-index:0;border-radius:12px;pointer-events:none;
  transition:opacity .25s}
.efxplate{position:absolute;inset:4px;z-index:2;border-radius:8px;pointer-events:none;
  clip-path:inset(0 round 8px)}
/* tier gradients on the band */
.card.framed.t-Bronze .efxframe{background:linear-gradient(135deg,#b06a30,#e0a468)}
.card.framed.t-Silver .efxframe{background:linear-gradient(135deg,#8e97a6,#d7dee9)}
.card.framed.t-Gold   .efxframe{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.card.framed.t-Elite  .efxframe{background:linear-gradient(135deg,#dc2626,#ef4444)}
.card.framed.t-Icon   .efxframe{background:linear-gradient(135deg,#ec4899,#f472b6)}
/* the plate keeps each tier's dark body colour */
.card.framed.t-Bronze .efxplate{background:linear-gradient(160deg,#241608,#141110)}
.card.framed.t-Silver .efxplate{background:linear-gradient(160deg,#1c2027,#121417)}
.card.framed.t-Gold   .efxplate{background:linear-gradient(160deg,#241d0a,#141210)}
.card.framed.t-Elite  .efxplate{background:linear-gradient(160deg,#2a0f1a,#150b12)}
.card.framed.t-Icon   .efxplate{background:linear-gradient(160deg,#241322,#160d18)}
/* framed cards: art, initials and type sit above the plate */
/* The art wrapper takes the PLATE's footprint (not the card's), so the band around
   it keeps showing the frame and the energy/sheen that ride it. */
.card.framed .cardartwrap{inset:4px;z-index:3;clip-path:inset(0 round 8px)}
.card.framed .cardart{z-index:3}
.card.framed .cardart-fade,.card.framed .cardart-scrim{z-index:4}
.card.framed .ini{position:relative;z-index:4}
.card.framed .efxov{z-index:5}
.card.framed .card-top,.card.framed .infobtn,.card.framed .nm,.card.framed .meta{position:relative;z-index:6}
/* the Icon tier's sweeping flare has to sit above the plate too */
.card.framed.t-Icon::after{z-index:5}

/* --- shaped frames: band + plate + effect layers all take the same silhouette --- */
.card.f-blade  .efxframe,.card.f-blade  .efxplate,.card.f-blade  .efxsheen,.card.f-blade  .efxenergy,.card.f-blade  .cardartwrap{clip-path:polygon(0% 0%,72% 0%,100% 16%,100% 100%,28% 100%,0% 84%)}
.card.f-chamf  .efxframe,.card.f-chamf  .efxplate,.card.f-chamf  .efxsheen,.card.f-chamf  .efxenergy,.card.f-chamf  .cardartwrap{clip-path:polygon(11% 0%,89% 0%,100% 8%,100% 92%,89% 100%,11% 100%,0% 92%,0% 8%)}
.card.f-notch  .efxframe,.card.f-notch  .efxplate,.card.f-notch  .efxsheen,.card.f-notch  .efxenergy,.card.f-notch  .cardartwrap{clip-path:polygon(0% 0%,39% 0%,43% 5%,57% 5%,61% 0%,100% 0%,100% 100%,61% 100%,57% 95%,43% 95%,39% 100%,0% 100%)}
.card.f-vault  .efxframe,.card.f-vault  .efxplate,.card.f-vault  .efxsheen,.card.f-vault  .efxenergy,.card.f-vault  .cardartwrap{clip-path:polygon(16% 0%,84% 0%,100% 13%,100% 28%,93% 33%,93% 67%,100% 72%,100% 87%,84% 100%,16% 100%,0% 87%,0% 72%,7% 67%,7% 33%,0% 28%,0% 13%)}
.card.f-rune   .efxframe,.card.f-rune   .efxplate,.card.f-rune   .efxsheen,.card.f-rune   .efxenergy,.card.f-rune   .cardartwrap{clip-path:polygon(20% 0%,80% 0%,100% 10%,100% 40%,94% 45%,94% 55%,100% 60%,100% 90%,80% 100%,68% 94%,56% 100%,44% 94%,32% 100%,20% 100%,0% 90%,0% 60%,6% 55%,6% 45%,0% 40%,0% 10%)}
.card.f-shield .efxframe,.card.f-shield .efxplate,.card.f-shield .efxsheen,.card.f-shield .efxenergy,.card.f-shield .cardartwrap{clip-path:polygon(0% 0%,100% 0%,100% 58%,86% 78%,50% 100%,14% 78%,0% 58%)}
.card.f-deco   .efxframe,.card.f-deco   .efxplate,.card.f-deco   .efxsheen,.card.f-deco   .efxenergy,.card.f-deco   .cardartwrap{clip-path:polygon(30% 0%,70% 0%,70% 3%,82% 3%,82% 8%,92% 8%,92% 14%,100% 14%,100% 86%,92% 86%,92% 92%,82% 92%,82% 97%,70% 97%,70% 100%,30% 100%,30% 97%,18% 97%,18% 92%,8% 92%,8% 86%,0% 86%,0% 14%,8% 14%,8% 8%,18% 8%,18% 3%,30% 3%)}
.card.f-crown  .efxframe,.card.f-crown  .efxplate,.card.f-crown  .efxsheen,.card.f-crown  .efxenergy,.card.f-crown  .cardartwrap{clip-path:polygon(50% 0%,57% 7%,65% 1%,72% 8%,82% 3%,86% 11%,100% 9%,100% 89%,88% 100%,12% 100%,0% 89%,0% 9%,14% 11%,18% 3%,28% 8%,35% 1%,43% 7%)}
.card.f-obel   .efxframe,.card.f-obel   .efxplate,.card.f-obel   .efxsheen,.card.f-obel   .efxenergy,.card.f-obel   .cardartwrap{clip-path:polygon(34% 0%,66% 0%,66% 4%,74% 4%,74% 9%,82% 9%,82% 15%,100% 15%,100% 85%,82% 85%,82% 91%,74% 91%,74% 96%,66% 96%,66% 100%,34% 100%,34% 96%,26% 96%,26% 91%,18% 91%,18% 85%,0% 85%,0% 15%,18% 15%,18% 9%,26% 9%,26% 4%,34% 4%)}
/* shaped frames get a fatter band so the silhouette reads at grid size.
   The plate re-uses the frame polygon (set above) rather than a rounded inset. */
.card[class*="f-"] .efxplate,.card[class*="f-"] .cardartwrap{inset:5px;border-radius:0}

/* --- sheen + energy now sit UNDER the plate, so only the band shows --- */
.efxsheen{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;border-radius:12px}
.efxenergy{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;
  mix-blend-mode:screen;border-radius:12px;overflow:hidden}
/* an equipped energy owns the band, so fade the tier gradient out from under it */
.card.on-sfx .efxframe{opacity:.28}

/* --- AURAS as real child elements (the old ::before/::after collided with
       .t-Icon::after, the Icon tier's flare) and tightly bounded so they
       hug the card instead of eating grid space --- */
.efxaura,.efxaura2{position:absolute;inset:0;pointer-events:none;border-radius:50%}
/* Positive z-index inside .aurahost's own isolated context. The old -1/-2 escaped
   to the nearest ancestor stacking context, so any parent with isolation or a
   background could bury the glow. */
.efxaura {z-index:1;transform:scale(1.42);filter:blur(17px) saturate(1.6) brightness(1.22)}
.efxaura2{z-index:0;transform:scale(1.85);filter:blur(34px) saturate(1.45) brightness(1.12);opacity:.88}
/* The aura sits on a wrapper, so the card keeps overflow:hidden and the Icon's
   sliding flare can no longer escape. That means the flare can stay ON — just
   turned down so the aura reads through it. */
.aurahost{position:relative;display:block;overflow:visible;isolation:isolate}
.aurahost .efxaura,.aurahost .efxaura2{position:absolute;inset:0;pointer-events:none;border-radius:50%}
/* the card rides above both glow layers */
.aurahost>.c3d{position:relative;z-index:2}
.card.has-aura.t-Icon::after{opacity:.42}
/* an equipped aura takes priority over the Icon pink — the wrapper is dimmed,
   not the aura. .flame wraps the card, so it has to be targeted directly. */
.flame.flame-dim::before{opacity:.38!important}
.flame.flame-dim::after{opacity:.30!important}
/* when an aura is equipped the tier flare steps back so the aura reads */
.card.has-aura .efxframe{opacity:.45}
.card.has-aura.t-Icon .efxframe{opacity:.34}
.card.has-aura.t-Icon,.card.has-aura.t-Elite,.card.has-aura.t-Gold{box-shadow:none!important}

/* ===== RAFTERS ===== */
.rfhero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(135deg,#1a1508,#141414 60%,#1a0d18);
  border:1px solid rgba(255,197,61,.3);border-radius:16px;padding:18px;margin-bottom:10px}
.rfhero h2{font-size:26px;margin-bottom:4px}
.rfhero p{font-size:12px;color:#c8c8d0;line-height:1.5;max-width:470px}
.rfbal{margin-left:auto;text-align:right;font-family:var(--disp);font-size:32px;color:var(--gold);line-height:1}
.rfbal small{display:block;font-family:inherit;font-size:9px;letter-spacing:.18em;color:var(--dim);margin-top:4px}
.rfodds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.rfo{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.rfo b{display:block;font-size:11px;letter-spacing:.06em}
.rfo span{font-size:14px;font-family:var(--disp);color:var(--ink)}
.rfstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-bottom:14px}
.rfstats>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.rfstats b{display:block;font-family:var(--disp);font-size:20px;color:var(--gold)}
.rfstats span{font-size:8.5px;letter-spacing:.12em;color:var(--dim)}

/* Siege-style reveal backdrop: light casts UP from the bottom edge, never a centred vignette.
   --rf-glow is rewritten the moment a pack is bought, so the leak matches the pulled rarity. */
.rfarena{position:relative;border:1px solid var(--line);border-radius:18px;min-height:470px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:contain;margin-bottom:12px;
  --rf-glow:#4a4f5c;
  background:linear-gradient(0deg,var(--rf-glow) 0%,rgba(15,12,25,.95) 50%,#08070d 100%);
  transition:background .5s ease-in-out,--rf-glow .5s ease-in-out}
/* hot bloom sitting on the bottom edge so the projection has a source */
.rfarena::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-14%;height:52%;
  pointer-events:none;z-index:0;filter:blur(34px);opacity:var(--rf-lift,.6);
  background:radial-gradient(60% 100% at 50% 100%,var(--rf-glow),transparent 72%);
  transition:opacity .5s ease-in-out}
/* halftone dot matrix, masked so it only catches the light in the lower half */
.rfarena::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);
  background-size:16px 16px;
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,1) 0%,rgba(0,0,0,0) 60%);
          mask-image:linear-gradient(to top,rgba(0,0,0,1) 0%,rgba(0,0,0,0) 60%)}
.rfarena>*{position:relative;z-index:2}
.rfstage{position:relative;width:214px;height:302px}
.rfpack{position:absolute;inset:0;animation:rffloat 5s ease-in-out infinite;
  -webkit-user-select:none;-webkit-touch-callout:none;cursor:default}
.rfpack.live{animation:none}
@keyframes rffloat{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-9px) rotate(.5deg)}}
/* v85: the illuminated opening grows only behind the silver pull-tab, so the seam
   reads as a zipper rather than the whole wrapper separating at once. */
.rfvoid{position:absolute;left:14px;top:10%;width:0;height:3px;transform:translateY(-50%);border-radius:3px 0 0 3px;
  background:linear-gradient(90deg,rgba(255,255,255,.15),var(--rf-glow) 72%,#fff 100%);
  box-shadow:0 0 12px 3px var(--rf-glow),0 0 28px 8px var(--rf-glow);opacity:0;
  transition:opacity .12s,background .35s,box-shadow .35s;pointer-events:none;z-index:7}
.rfspill{position:absolute;left:14px;top:10%;width:0;height:190px;z-index:2;opacity:0;
  pointer-events:none;transform-origin:0 0;filter:blur(13px);mix-blend-mode:screen;
  background:linear-gradient(180deg,var(--rf-glow) 0%,var(--rf-glow) 18%,transparent 70%);
  transition:background .35s;border-radius:0 0 50% 50%}
.rfhalf{position:absolute;inset:0;overflow:hidden;border-radius:16px;
  background:linear-gradient(148deg,#1c1c24,#0c0c11 32%,#24242f 52%,#09090d 74%,#1e1e28);
  box-shadow:0 18px 44px rgba(0,0,0,.7),inset 0 0 0 1.5px rgba(255,255,255,.08)}
.rfhalf::before{content:"";position:absolute;inset:0;opacity:.26;
  background:linear-gradient(118deg,transparent 38%,rgba(130,200,255,.7) 47%,rgba(255,140,220,.6) 53%,transparent 62%);
  background-size:280% 100%;animation:rfshine 5.5s linear infinite}
@keyframes rfshine{0%{background-position:190% 0}100%{background-position:-90% 0}}
.rflid{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:7.5px;
  letter-spacing:.3em;color:rgba(255,255,255,.45)}
.rfbrand{position:absolute;inset:10% 0 0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px}
.rfmark{width:60px;height:60px;border-radius:50%;border:2.5px solid var(--rf-glow);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:22px;
  color:var(--gold);box-shadow:0 0 18px rgba(255,197,61,.3),inset 0 0 16px rgba(255,197,61,.15)}
.rfname{font-family:var(--disp);font-size:23px;color:#f3f3f7;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.rfsub{font-size:7.5px;letter-spacing:.32em;color:rgba(255,255,255,.36)}
.rftrack{position:absolute;left:14px;right:14px;top:10%;height:3px;transform:translateY(-50%);z-index:6;
  border-radius:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 3px,transparent 3px 7px);
  box-shadow:inset 0 1px rgba(255,255,255,.08)}
.rftab{position:absolute;top:10%;z-index:9;width:42px;height:32px;margin:-16px 0 0 -21px;cursor:grab;
  touch-action:none;-webkit-user-select:none;-webkit-touch-callout:none;will-change:left,transform}
/* generous but still zipper-only hit target for iPhone fingers */
.rftab::after{content:"";position:absolute;inset:-12px -14px}
.rftab:active{cursor:grabbing;transform:scale(.97)}
.rftabb{position:absolute;inset:0;border-radius:6px;
  background:linear-gradient(160deg,#f7f9fb,#7d8794 31%,#fff 50%,#59616d 72%,#e7ebef);
  box-shadow:0 4px 11px rgba(0,0,0,.72),inset 0 0 0 1px rgba(0,0,0,.38),inset 0 1px 1px rgba(255,255,255,.9)}
.rftabb::before{content:"";position:absolute;left:8px;right:8px;top:8px;height:2px;border-radius:2px;
  background:rgba(35,40,48,.5);box-shadow:0 6px rgba(35,40,48,.32),0 12px rgba(35,40,48,.22)}
.rfhint{position:absolute;left:50px;top:38px;white-space:nowrap;
  font-size:8px;letter-spacing:.18em;color:rgba(255,255,255,.52);animation:rfnudge 1.8s ease-in-out infinite;pointer-events:none}
@keyframes rfnudge{0%,100%{transform:translateX(0);opacity:.45}50%{transform:translateX(7px);opacity:1}}
.rfpack.live .rfhint{opacity:0;animation:none}
.rfreveal{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  isolation:isolate;
  justify-content:center;gap:14px;padding:16px;text-align:center}
/* showcase moment \u2014 the glow gets more room than it does in a crowded grid */
.rfitem .efxaura {transform:scale(1.52);filter:blur(19px) saturate(1.75) brightness(1.3)}
.rfitem .efxaura2{transform:scale(2.05);filter:blur(40px) saturate(1.5) brightness(1.18);opacity:.95}
.rfreveal.show{display:flex}
/* scale a normal-size card rather than resizing it, so initials, padding and type
   stay in exactly the proportions they have in pack and draft mode */
.rfitem{width:150px;height:228px;display:flex;align-items:center;justify-content:center;
  transform-origin:center}
/* Scale the WRAPPER, not .card \u2014 scaling the card alone left the aura at 1\u00d7
   behind a 1.44\u00d7 card, which hid the glow almost completely. */
.rfitem>*{transform:scale(1.44);transform-origin:center;flex:0 0 auto}
.rfrar{font-family:var(--disp);font-size:23px;letter-spacing:.08em}
.rfename{font-size:14px;color:#fff;font-weight:700;margin-top:2px}
.rffor{font-size:11px;color:var(--dim);margin-top:2px}
.rfnew{font-size:10px;letter-spacing:.14em;color:#7dffc0;margin-top:6px}
.rfdupe{font-size:10.5px;color:var(--gold);margin-top:6px}
.rfbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rfbuy{text-align:center}
.rfbuy .btn{min-width:220px}
.rfneed{font-size:11px;color:#ff9b9b;margin-top:8px}
.rfcost{font-family:var(--disp);font-size:15px;letter-spacing:.08em;color:var(--gold);margin-top:2px}

/* ---- home bubble: frosted glass disc, top-left of every screen but the hub ---- */
.topleft{display:flex;align-items:center;gap:11px;min-width:0}
.homebtn{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  color:var(--dim);background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);
  transition:background .2s,border-color .2s,color .2s,box-shadow .2s,transform .14s}
.homebtn svg{width:17px;height:17px;display:block;fill:none;stroke:currentColor;
  stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.homebtn:hover,.homebtn:focus-visible{color:var(--cyan);background:rgba(53,214,255,.15);
  border-color:var(--cyan);box-shadow:0 0 18px rgba(53,214,255,.42);outline:none}
.homebtn:active{transform:scale(.93)}
@media(prefers-reduced-motion:reduce){.homebtn{transition:none}}
.rfnote{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5;font-style:italic}

/* ===== COLLECTION: equip drawer ===== */
.eqwrap{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.eqhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.eqhead h3{font-size:15px}
.eqhead span{font-size:11px;color:var(--dim)}
.eqclose{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  border-radius:8px;padding:6px 12px;font-size:11px;cursor:pointer}
.eqslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.eqslot h4{font-size:9.5px;letter-spacing:.14em;color:var(--dim);margin-bottom:6px}
.eqrow{display:flex;flex-wrap:wrap;gap:5px}
.eqchip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:8px;
  padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer}
.eqchip.on{background:var(--gold);border-color:var(--gold);color:#241d08}
.eqchip small{display:block;font-size:7.5px;letter-spacing:.1em;opacity:.7;font-weight:600}
.eqempty{font-size:11px;color:var(--dim);font-style:italic}
.eqpreview{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.eqpreview .card{width:118px;height:180px;flex:0 0 auto}

/* ===== enlarged card viewer ===== */
#cardzoom{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 90% at 50% 40%,rgba(10,10,14,.82),rgba(3,3,5,.95));
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
#cardzoom.show{display:flex;animation:zfade .2s ease-out}
@keyframes zfade{from{opacity:0}to{opacity:1}}
.zoomwrap{display:flex;flex-direction:column;align-items:center;gap:16px;animation:zin .38s cubic-bezier(.2,.9,.28,1.15)}
@keyframes zin{from{opacity:0;transform:scale(.7) translateY(26px)}to{opacity:1;transform:scale(1) translateY(0)}}
/* gentle continuous hover — separate layer from the scale so transforms don't fight */
.zoomfloat{animation:zfloat 5.6s ease-in-out infinite;will-change:transform}
@keyframes zfloat{
  0%{transform:translateY(0) rotate(-.7deg)}
  50%{transform:translateY(-15px) rotate(.7deg)}
  100%{transform:translateY(0) rotate(-.7deg)}
}
.zoomscale{transform:scale(2.6);transform-origin:center;cursor:pointer;
  filter:drop-shadow(0 26px 42px rgba(0,0,0,.75))}
/* the enlarged copy needs room around it for the scaled card */
.zoomfloat{margin:calc(158px * 0.8) calc(104px * 0.8)}
.zoomscale .efxaura {transform:scale(1.5);filter:blur(18px) saturate(1.7) brightness(1.28)}
.zoomscale .efxaura2{transform:scale(2);filter:blur(38px) saturate(1.5) brightness(1.16);opacity:.95}
.zoomscale .card{transition:none}
.zoomscale .card:active{transform:none}
.zoomhint{font-size:11px;letter-spacing:.14em;color:var(--dim);text-align:center}
/* ---- peek: hover (or press-and-hold on touch) fades the card furniture so the art shows ---- */
.zoomscale .card .ovr,.zoomscale .card .pos,.zoomscale .card .nm,.zoomscale .card .meta,
.zoomscale .card .infobtn,.zoomscale .card .cardart-scrim,.zoomscale .card .cardart-fade,
.zoomscale .card .ini{transition:opacity .38s ease}
.zoomscale:hover .card.hasart .ovr,.zoomscale.peek .card.hasart .ovr,
.zoomscale:hover .card.hasart .pos,.zoomscale.peek .card.hasart .pos,
.zoomscale:hover .card.hasart .nm,.zoomscale.peek .card.hasart .nm,
.zoomscale:hover .card.hasart .meta,.zoomscale.peek .card.hasart .meta{opacity:.14}
.zoomscale:hover .card.hasart .infobtn,.zoomscale.peek .card.hasart .infobtn{opacity:.1}
/* pull the darkening layers back too, otherwise the art still sits under a shadow */
.zoomscale:hover .card.hasart .cardart-scrim,.zoomscale.peek .card.hasart .cardart-scrim{opacity:.12}
.zoomscale:hover .card.hasart .cardart-fade,.zoomscale.peek .card.hasart .cardart-fade{opacity:.18}
.zoomhint{transition:opacity .3s ease}
.zoomscale:hover ~ .zoomhint{opacity:.45}

.zoomclose{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:999px;
  padding:9px 26px;font-size:13px;font-weight:700;cursor:pointer}
.zoomclose:hover{border-color:var(--cyan);color:var(--cyan)}
@media(max-width:560px){.zoomscale{transform:scale(2.1)}.zoomfloat{margin:calc(158px * 0.58) calc(104px * 0.58)}}
@media(max-height:680px){.zoomscale{transform:scale(1.85)}.zoomfloat{margin:calc(158px * 0.45) calc(104px * 0.45)}}
@media(prefers-reduced-motion:reduce){.zoomfloat{animation:none}.zoomwrap{animation:none}}
/* ===== beta banner + credits pill ===== */
#betabar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  background:linear-gradient(90deg,rgba(255,197,61,.30),rgba(53,214,255,.24));border-bottom:2px solid rgba(255,197,61,.6);
  padding:16px 16px;font-size:23px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#fff6df;
  text-shadow:0 1px 10px rgba(255,197,61,.35);animation:betapulse 2.6s ease-in-out infinite}
@keyframes betapulse{0%,100%{background:linear-gradient(90deg,rgba(255,197,61,.22),rgba(53,214,255,.18))}
  50%{background:linear-gradient(90deg,rgba(255,197,61,.40),rgba(53,214,255,.30))}}
@media(prefers-reduced-motion:reduce){#betabar{animation:none}}

  text-decoration:none;cursor:pointer;padding:0 6px;display:inline-flex;align-items:center;gap:12px;line-height:1;vertical-align:middle}
#betabar button span{text-decoration:underline}
#betabar button::before{content:"▶";animation:betaarrowL 1.2s ease-in-out infinite}
#betabar button::after{content:"◀";animation:betaarrowR 1.2s ease-in-out infinite}
@keyframes betaarrowL{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes betaarrowR{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
@media(prefers-reduced-motion:reduce){#betabar button::before,#betabar button::after{animation:none}}
#crpill{margin-left:auto;background:rgba(0,0,0,.35);border:1px solid rgba(255,197,61,.45);color:var(--gold);

.credittoast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:80;
  background:linear-gradient(180deg,#241d08,#14100a);border:1px solid rgba(255,197,61,.6);border-radius:12px;
  padding:9px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);
  animation:crpop .3s ease-out, crfade .4s ease-in 2.2s forwards}
.credittoast b{font-family:var(--disp);font-size:18px;color:var(--gold)}
.credittoast span{font-size:11px;color:#cfc9bb}
@keyframes crpop{from{opacity:0;transform:translate(-50%,14px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes crfade{to{opacity:0;transform:translate(-50%,-8px)}}

.uphero{background:linear-gradient(135deg,#0d1a20,#141414 60%,#1a1508);border:1px solid rgba(53,214,255,.3);
  border-radius:16px;padding:18px;margin-bottom:14px}
.uphero .up-tag{font-size:10px;letter-spacing:.22em;color:var(--cyan);margin-bottom:6px}
.uphero h2{font-size:26px;margin-bottom:4px}.uphero p{font-size:12px;color:#c8c8d0;line-height:1.5;max-width:520px}
.upblock{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.upblock h3{font-size:13px;letter-spacing:.12em;margin-bottom:8px}
.upblock.done h3{color:#7dffc0}.upblock.wip h3{color:var(--gold)}.upblock.soon h3{color:var(--cyan)}
.upblock ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.upblock li{font-size:12.5px;color:#cfcfd6;padding-left:14px;position:relative;line-height:1.45}
.upblock li:before{content:"\2022";position:absolute;left:0;color:var(--dim)}
.upnote{text-align:center;font-size:11px;color:var(--dim);margin-top:6px}
@media(max-width:560px){.shophero{gap:10px}.crbig{margin-left:0;text-align:left;font-size:28px}}

.dailybanner{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#1a1508,#171717 55%,#0d1a20);border:1px solid rgba(255,197,61,.3);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.dailybanner .db-tag{font-size:9px;letter-spacing:.2em;color:var(--gold)}
.dailybanner .db-main{flex:1}.dailybanner .db-main h2{font-size:19px;margin:2px 0 1px}.dailybanner .db-main p{color:#c8c8d0;font-size:11px;line-height:1.4}
.dailybanner .db-meta{display:flex;gap:12px;font-size:11px;color:var(--dim);text-align:right}.dailybanner .db-meta b{color:var(--ink);font-family:var(--disp);font-size:16px}
#dailynotice{padding:11px 13px;border-radius:10px;font-size:13px;text-align:center;font-weight:600}
.dailyok,.dailywin{background:rgba(57,255,156,.12);border:1px solid rgba(57,255,156,.4);color:#7dffc0}
.dailyhintbar{background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.dailyblock{background:rgba(255,77,109,.14);border:1px solid rgba(255,77,109,.5);color:#ff9caa}
@media(max-width:560px){.dailybanner{flex-wrap:wrap;gap:8px}.dailybanner .db-meta{text-align:left}}

  const R=rng||Math.random,byName={};
  pool.forEach(p=>(byName[p.name]=byName[p.name]||[]).push(p));
  const hard=hardBlocked||new Set(),soft=softBlocked||new Set();
  let names=Object.keys(byName).filter(n=>!hard.has(n)&&!soft.has(n));
  if(!names.length)names=Object.keys(byName).filter(n=>!hard.has(n)); /* only repeat if the tier/slot forces it */
  if(!names.length)return null;
  const minShown=Math.min(...names.map(n=>DRAFT_NAME_SHOWN[n]||0));
  const weights=names.map(n=>{
    const gap=(DRAFT_NAME_SHOWN[n]||0)-minShown;
    return Math.pow(0.32,gap)*draftRecencyWeight(n)*Math.sqrt(SPOTLIGHT[n]??1);
  });
  const name=names[weightedIndex(weights,R)],versions=byName[name];
  const minCard=Math.min(...versions.map(p=>DRAFT_CARD_SHOWN[p.id]||0));
  const fairest=versions.filter(p=>(DRAFT_CARD_SHOWN[p.id]||0)<=minCard);
  const card=fairest[Math.floor(R()*fairest.length)];
  DRAFT_NAME_SHOWN[name]=(DRAFT_NAME_SHOWN[name]||0)+1;
  DRAFT_NAME_LAST[name]=DRAFT_FAIR_SESSION;
  DRAFT_CARD_SHOWN[card.id]=(DRAFT_CARD_SHOWN[card.id]||0)+1;
  return card;
}

/* ================= PHASE 5: DAILY CHALLENGE (DRAFT FORMAT) ================= */
/* A date-seeded DRAFT: everyone gets the same challenge + the same option boards each day.
   Tap each slot to reveal draft options drawn from the day's seeded pool, filtered by the
   day's ban (so banned cards are never even offered). Blocked submission if the final
   board violates the constraint. Streak + personal best persist. */
const DAILY_KEY="atu-daily-v1";
function emptyDaily(){return {streak:0,lastPlayed:null,best:{},history:{}};}
let DAILY=sGet(DAILY_KEY)||emptyDaily();
DAILY.best=DAILY.best||{};DAILY.history=DAILY.history||{};
function saveDaily(){sSet(DAILY_KEY,DAILY);}
/* deterministic seeded RNG so a given date => identical challenge, pool and option boards everywhere */
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function seededRng(seedStr){return mulberry32(xmur3(seedStr)());}
function todayKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dayIndex(dateKey){const [y,m,dd]=dateKey.split("-").map(Number);return Math.floor(Date.UTC(y,m-1,dd)/86400000);}

/* One Franchise rotates across these four — deepest rosters with real star power */
const FRANCHISE_CYCLE=["LAL","BOS","GSW","PHX"];
let DD_FRANCHISE=null;
function dailyFor(dateKey){dateKey=dateKey||todayKey();return DAILY_CYCLE[((dayIndex(dateKey)%DAILY_CYCLE.length)+DAILY_CYCLE.length)%DAILY_CYCLE.length];}

/* ---- date-seeded draft pool: filtered by the day's ban, guaranteed constraint-solvable ---- */
function dailyDraftPool(dateKey){
  dateKey=dateKey||todayKey();
  const ch=dailyFor(dateKey),rng=seededRng("pool-"+dateKey);
  const shuf=arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  /* eraLock challenges: pick THE decade for this day (rotates), then ban every other era */
  let lockedEra=null;
  if(ch.eraLock){const eras=viableEras();lockedEra=eras[dayIndex(dateKey)%eras.length];}
  const banned=p=>(ch.ban&&ch.ban(p))||(lockedEra&&p.era!==lockedEra);
  let base=DB.filter(p=>!banned(p));
  /* franchise-lock: restrict to ONE seeded team that can fill all five slots */
  if(ch.franchiseLock){
    /* rotate through the four deepest, most star-loaded franchises so each One Franchise
       day is a recognisable team with enough depth to draft a real squad */
    const teams={};base.forEach(p=>{(teams[p.team]=teams[p.team]||[]).push(p);});
    const cycle=FRANCHISE_CYCLE.filter(t=>teams[t]&&STARTER_SLOTS.every(s=>teams[t].some(p=>eligible(p,s))));
    /* index by which OCCURRENCE of this challenge it is, not the raw day number:
       challenges recur every 14 days and 14 mod 4 aliases to only two of the four teams */
    const occ=Math.floor(dayIndex(dateKey)/DAILY_CYCLE.length);
    let pick=cycle.length?cycle[((occ%cycle.length)+cycle.length)%cycle.length]:null;
    if(!pick){ /* fallback: any viable team */
      const viable=Object.entries(teams).filter(([t,a])=>STARTER_SLOTS.every(s=>a.some(p=>eligible(p,s))));
      pick=shuf(viable.map(v=>v[0]))[0];
    }
    base=teams[pick]||base;
    DD_FRANCHISE=pick;
  }
  const ids=new Set(base.map(p=>p.id));
  const inject=names=>names.forEach(n=>{const c=DB.find(p=>p.name===n);if(c&&!banned(c)&&!ids.has(c.id)){base.push(c);ids.add(c.id);}});
  if(ch.seedTrio){const trios=DUOS.filter(g=>g.m.length===3);inject(shuf(trios)[0].m);}
  if(ch.seedBonds){shuf(DUOS).slice(0,ch.seedBonds).forEach(g=>inject(g.m));}
  if(ch.id==="decade-lock"){ /* guarantee one decade can fill all five starter slots */
    const eras={};base.forEach(p=>{(eras[p.era]=eras[p.era]||[]).push(p);});
    const viable=Object.entries(eras).filter(([e,a])=>STARTER_SLOTS.every(s=>a.some(p=>eligible(p,s))));
    if(!viable.length){ /* force one: pick the era with most players, top up missing slots from DB */
      const era=shuf(Object.keys(eras))[0]||"'10s";
      STARTER_SLOTS.forEach(s=>{if(!(eras[era]||[]).some(p=>eligible(p,s))){const c=shuf(DB.filter(p=>p.era===era&&eligible(p,s)&&!(ch.ban&&ch.ban(p))))[0];if(c&&!ids.has(c.id)){base.push(c);ids.add(c.id);}}});
    }
  }
  if(ch.id==="positionless"){ /* ensure 5 distinct primary positions exist */
    ["PG","SG","SF","PF","C"].forEach(pos=>{if(!base.some(p=>p.pos===pos)){const c=shuf(DB.filter(p=>p.pos===pos&&!(ch.ban&&ch.ban(p))))[0];if(c&&!ids.has(c.id)){base.push(c);ids.add(c.id);}}});
  }
  if(ch.id==="rivalry"){ /* ensure 4+ distinct teams that can cover slots */
    const teams=[...new Set(base.map(p=>p.team))];if(teams.length<5){shuf(DB).slice(0,20).forEach(c=>{if(!ids.has(c.id)&&!(ch.ban&&ch.ban(c))){base.push(c);ids.add(c.id);}});}
  }
  return {pool:base,rng:seededRng("boards-"+dateKey)};
}

/* ---- daily draft state (mirrors D, but seeded + pool-restricted) ---- */
let DD=null;
function dailyEligiblePool(slot){return DD.pool.filter(p=>eligible(p,slot));}
/* ---- POOL-RELATIVE RARITY ----
   Whatever the day bans, the pull still feels like a draft: the day's own pool is
   ranked by OVR and split into five bands that inherit the draft's rarity odds.
   On "Underdog" (nothing 90+) the 89s BECOME the Icons — a 2% thrill — while the
   bottom of that pool becomes the common band. Same for Silver&Below, Grit&Grind, etc. */
const DAILY_BAND_SHARE={Icon:.04,Elite:.10,Gold:.30,Silver:.36,Bronze:.20}; /* size of each band */
/* Re-banding is ONLY for challenges that cut off the top of the rating range
   (Underdog, Silver&Below, Grit&Grind, No Icons). Those pools have no real Icons,
   so we promote their best players into the rare band to keep the pull exciting.
   Era/roster-shape challenges (Rookie Szn, Decade Lock, One Franchise, Rivalry...)
   still contain genuine Icons — their real tiers already work, so leave them be. */
function dailyNeedsReband(){
  if(DD._reband!==undefined)return DD._reband;
  /* if the pool is missing the top tiers, the rarity curve has collapsed — rebuild it */
  /* Reband only when the pool has NO rare tier left at all. Losing just Icons is
     fine — Elites still provide a genuine rare pull (e.g. "No Icons" keeps 52). */
  const hasIcon=DD.pool.some(p=>p.tier==="Icon");
  const hasElite=DD.pool.some(p=>p.tier==="Elite");
  DD._reband=!hasIcon&&!hasElite;
  return DD._reband;
}
function dailyBands(){
  if(DD._bands)return DD._bands;
  const order=["Icon","Elite","Gold","Silver","Bronze"];
  const bands={};
  if(!dailyNeedsReband()){ /* real tiers intact — use them as-is */
    order.forEach(t=>bands[t]=DD.pool.filter(p=>p.tier===t));
    /* if a top tier is empty (e.g. "No Icons"), promote the next real tier into it so the
       rare roll still lands on the pool's genuine best rather than falling through */
    for(let i=0;i<order.length-1;i++){
      if(!bands[order[i]].length){
        const next=order.slice(i+1).find(t=>bands[t].length);
        if(next){bands[order[i]]=bands[next];bands[next]=[];}
      }
    }
    DD._bands=bands;return bands;
  }
  const ranked=DD.pool.slice().sort((a,b)=>b.ovr-a.ovr||a.name.localeCompare(b.name));
  const n=ranked.length;let i=0;
  order.forEach((t,k)=>{
    const count=(k===order.length-1)?n-i:Math.max(1,Math.round(n*DAILY_BAND_SHARE[t]));
    bands[t]=ranked.slice(i,i+count);i+=count;
  });
  DD._bands=bands;return bands;
}
function dailyBandOf(p){
  const b=dailyBands();
  for(const t of ["Icon","Elite","Gold","Silver","Bronze"])if(b[t].some(x=>x.id===p.id))return t;
  return "Silver";
}
/* ---- bond surfacing ----
   Duo Hunt / Dynasty are impossible if partners never appear together: with 5-card
   boards drawn from hundreds of players, the odds of being offered BOTH halves of a
   bond are effectively nil. So on bond challenges we actively surface partners:
   once you've drafted half a bond, the missing member(s) get a guaranteed slot on
   later boards whenever they're position-eligible. Before any bond is started, we
   seed one member of the day's target bond so the chain has somewhere to begin. */
function dailyBondTargets(slot,taken){
  const ch=DD.challenge;
  if(!(ch.id==="duo-hunt"||ch.id==="dynasty"))return [];
  const drafted=new Set(ALL_SLOTS.map(s=>DD.roster[s]).filter(x=>x!=null).map(id=>DB[id].name));
  const wantTrio=ch.id==="dynasty";
  const groups=DUOS.filter(g=>wantTrio?g.m.length===3:true);
  const out=[];
  /* 1) partners of bonds already started */
  groups.forEach(g=>{
    const have=g.m.filter(n=>drafted.has(n)).length;
    if(have>0&&have<g.m.length){
      g.m.filter(n=>!drafted.has(n)).forEach(n=>{
        const c=DD.pool.find(p=>p.name===n&&eligible(p,slot)&&!taken.has(p.name));
        if(c)out.push(c);
      });
    }
  });
  if(out.length)return out;
  /* 2) nothing started yet — offer an entry point into a bond that's fully available */
  const viable=groups.filter(g=>g.m.every(n=>DD.pool.some(p=>p.name===n)));
  for(const g of viable){
    for(const n of g.m){
      const c=DD.pool.find(p=>p.name===n&&eligible(p,slot)&&!taken.has(p.name));
      if(c){out.push(c);break;}
    }
    if(out.length>=2)break;
  }
  return out;
}
function dailyOptionsFor(slot){
  /* seeded board of 5: tiers are drawn with DRAFT_ODDS against the day's OWN bands,
     so every challenge keeps a real rarity curve instead of a flat shuffle */
  const taken=new Set(ALL_SLOTS.map(s=>DD.roster[s]).filter(x=>x!=null).map(id=>DB[id].name));
  const boardNames=new Set(),opts=[];
  /* bond challenges: reserve up to 2 slots for partners so the bond is actually completable */
  dailyBondTargets(slot,taken).slice(0,2).forEach(p=>{
    if(!boardNames.has(p.name)){opts.push(p);boardNames.add(p.name);}
  });
  const bands=dailyBands();
  const eligibleIn=t=>bands[t].filter(p=>eligible(p,slot)&&!taken.has(p.name)&&!boardNames.has(p.name));
  const order=["Icon","Elite","Gold","Silver","Bronze"];
  let guard=0;
  while(opts.length<5&&guard++<200){
    /* roll a band using the draft's rarity odds, then step down if it's empty */
    let r=DD.rng(),acc=0,pick=null;
    for(const t of order){acc+=DRAFT_ODDS[t]||0;if(r<=acc){pick=t;break;}}
    if(!pick)pick="Silver";
    let cands=eligibleIn(pick);
    if(!cands.length){ /* walk outward to the nearest band that has someone */
      const idx=order.indexOf(pick);
      for(let d=1;d<order.length&&!cands.length;d++){
        const lo=order[idx+d],hi=order[idx-d];
        if(lo&&eligibleIn(lo).length){cands=eligibleIn(lo);break;}
        if(hi&&eligibleIn(hi).length){cands=eligibleIn(hi);break;}
      }
    }
    if(!cands.length)break;
    const p=cands[Math.floor(DD.rng()*cands.length)];
    opts.push(p);boardNames.add(p.name);
  }
  return opts;
}
function dailyStart(dateKey){
  dateKey=dateKey||todayKey();
  const {pool,rng}=dailyDraftPool(dateKey);
  DD={dateKey,challenge:dailyFor(dateKey),pool,rng,_bands:null,_reband:undefined,franchise:DD_FRANCHISE,lockedEra:(dailyFor(dateKey).eraLock?viableEras()[dayIndex(dateKey)%viableEras().length]:null),
      stage:"picking",roster:emptyRoster(),taken:[],opts:null,slotOpts:{},activeSlot:null,lastSlot:null,done:false,
      submitted:!!DAILY.history[dateKey]};
}
function dailySlotTap(slot){
  if(!DD||DD.stage!=="picking"||DD.done)return; /* once all 8 are in, the board is locked — no swapping */
  if(DD.roster[slot]!=null)return;
  DD.activeSlot=slot;
  if(!DD.slotOpts[slot])DD.slotOpts[slot]=dailyOptionsFor(slot);
  DD.opts=DD.slotOpts[slot];
  render();
}
function dailyPickInto(pid){
  const slot=DD.activeSlot;if(!slot||DD.roster[slot]!=null)return;
  const p=DB[pid];
  if(DD.taken.some(id=>DB[id].name===p.name)){notice(p.name+" already on your board.");return;}
  DD.roster[slot]=pid;DD.taken.push(pid);DD.lastSlot=slot;DD.activeSlot=null;DD.opts=null;
  const full=STARTER_SLOTS.every(s=>DD.roster[s]!=null)&&BENCH_SLOTS.every(s=>DD.roster[s]!=null);
  if(full){DD.done=true;dailyFinalize();}
  render();
}
function dailyClearActive(){DD.activeSlot=null;DD.opts=null;render();}
/* ---- rearranging the finished daily board (same rules as Classic Draft) ----
   You can't re-pick a different card, but you CAN move your 8 drafted players
   between slots. Each move re-checks the day's constraint and re-scores. */
function dailyOpenMove(slot){
  if(!DD||!DD.done)return;
  const cur=DB[DD.roster[slot]];
  const fromBench=BENCH_SLOTS.includes(slot);
  const canLand=(mover,dest)=>BENCH_SLOTS.includes(dest)||eligible(mover,dest);
  const legalStarter=s2=>{
    if(s2===slot)return false;
    const occ=DB[DD.roster[s2]];
    return canLand(cur,s2)&&canLand(occ,slot);
  };
  const rows=STARTER_SLOTS.filter(legalStarter).map(s2=>{
    const occ=DB[DD.roster[s2]];
    return `<button class="btn gold" onclick="doDailyMove('${slot}','${s2}')">
      <span>Start at ${SLOT_LABEL[s2]}</span>
      <small style="color:var(--dim)">swaps with ${esc(occ.name)} ${occ.ovr}</small></button>`;
  }).join("");
  let benchRow="";
  if(!fromBench){
    const open=BENCH_SLOTS.find(s2=>DD.roster[s2]==null);
    if(open!=null)benchRow=`<button class="btn" onclick="doDailyMove('${slot}','${open}')"><span>Move to bench</span></button>`;
    else{const t=BENCH_SLOTS.find(s2=>eligible(DB[DD.roster[s2]],slot));
      if(t!=null){const occ=DB[DD.roster[t]];
        benchRow=`<button class="btn" onclick="doDailyMove('${slot}','${t}')"><span>Move to bench</span><small style="color:var(--dim)">swaps with ${esc(occ.name)} ${occ.ovr}</small></button>`;}}
  }
  const none=(rows||benchRow)?"":`<div class="who" style="color:var(--dim)">No legal moves \u2014 nobody else can cover ${SLOT_LABEL[slot]} and ${esc(cur.name)} only fits ${cur.positions.join("/")}.</div>`;
  $("#sheet").innerHTML=`<div class="sheetbox"><h3>Move \u00b7 ${esc(cur.name)} ${cur.ovr}</h3>
    <div class="who">${fromBench?"On the bench":"Starting at "+SLOT_LABEL[slot]}. Rearrange your drafted eight \u2014 whoever's there trades places.</div>
    <div class="swaprows">${rows}${benchRow}</div>${none}<button class="btn" onclick="closeSheet()">Cancel</button></div>`;
  $("#sheet").classList.add("show");
  $("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet();};
}
function doDailyMove(a,b){
  const pa=DB[DD.roster[a]],pb=DB[DD.roster[b]];
  if(!eligible(pa,b)||!eligible(pb,a)){notice("Those positions don't fit.");return;}
  [DD.roster[a],DD.roster[b]]=[DD.roster[b],DD.roster[a]];
  DD.lastSlot=b;closeSheet();
  dailyFinalize({rearrange:true}); /* re-check the constraint + re-score with the new arrangement */
  render();
  notice(esc(pa.name)+" \u2192 "+SLOT_LABEL[b]+".");
}
function dailyFinalize(opts){
  const first=!(opts&&opts.rearrange);
  const v=dailyValidity();DD.finalValid=v.valid;
  if(v.valid){const res=dailySubmit();DD.finalResult=res.ok?res:null;
    if(res.ok&&first&&res.result.wins>=70)confetti(70);} /* celebrate once, not on every move */
  else DD.finalResult=null;
}
function dailyStarters(){return STARTER_SLOTS.map(s=>DD.roster[s]!=null?DB[DD.roster[s]]:null).filter(Boolean);}
function dailyValidity(){
  if(!DD)return {full:false,valid:false,reason:"No draft in progress"};
  const full=STARTER_SLOTS.every(s=>DD.roster[s]!=null);
  if(!full)return {full:false,valid:false,reason:"Draft all five starters"};
  const ok=DD.challenge.valid(dailyStarters(),DD.roster);
  return {full:true,valid:ok,reason:ok?"Constraint met":"Constraint not met: "+DD.challenge.hint};
}
function dailyResult(){const o=teamOVR(DD.roster),pr=projection(o.eff);return {ovr:o.total,eff:o.eff,chem:o.chem.bonus,wins:pr.wins,identity:recordIdentity(pr.wins)};}
function dailySubmit(){
  const v=dailyValidity();
  if(!v.valid)return {ok:false,reason:v.reason};
  const r=dailyResult(),key=DD.dateKey,prev=DAILY.lastPlayed;
  const alreadyToday=!!DD.submitted; /* rearranging a locked board must not re-pay credits */
  if(prev!==key){ /* yesterday relative to the SUBMITTED day, not the wall clock */
    const [yy,mm,ddN]=key.split("-").map(Number);const y=new Date(Date.UTC(yy,mm-1,ddN-1));
    const yKey=y.getUTCFullYear()+"-"+String(y.getUTCMonth()+1).padStart(2,"0")+"-"+String(y.getUTCDate()).padStart(2,"0");
    DAILY.streak=(prev===yKey)?(DAILY.streak+1):1;DAILY.lastPlayed=key;}
  const pb=DAILY.best[key];
  if(!pb||r.wins>pb.wins)DAILY.best[key]={wins:r.wins,ovr:r.ovr,chem:+r.chem.toFixed(1),title:r.identity.title};
  if(!DD.submitted)DAILY.history[key]=(DAILY.history[key]||0)+1; /* count the day once, not per rearrange */
  DD.submitted=true;saveDaily();
  if(!alreadyToday&&typeof creditsForDaily==="function")creditsForDaily(DAILY.streak);
  /* a 7-day daily streak earns a free Rafters pack */
  if(!alreadyToday&&typeof grantPack==="function"&&DAILY.streak>0&&DAILY.streak%7===0)
    grantPack(1,"7-day streak \u2014 free pack!");
  if(typeof trophyRoster==="function")trophyRoster("daily",DD.roster);
  return {ok:true,result:r,best:DAILY.best[key],streak:DAILY.streak};
}
