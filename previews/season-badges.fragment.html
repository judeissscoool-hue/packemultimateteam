<div id="atu-season-badges">
  <style>
    #atu-season-badges{color-scheme:dark;background:#121416;color:#f3f3f7;font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;border-radius:16px;overflow:hidden;max-width:736px;margin:auto}
    #atu-season-badges *{box-sizing:border-box}
    #atu-season-badges .atu-strip{padding:11px 22px;background:#252218;border-bottom:1px solid #594b27;display:flex;justify-content:space-between;gap:12px;color:#ffc53d;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    #atu-season-badges .atu-strip span:last-child{color:#c4b78f}
    #atu-season-badges .atu-body{padding:28px 24px 30px}
    #atu-season-badges h2{font:400 28px/1.1 Impact,'Arial Narrow','Arial Black',sans-serif;letter-spacing:.04em;text-transform:uppercase;margin:0 0 28px}
    #atu-season-badges .atu-podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;text-align:center;padding:2px 0 29px;border-bottom:1px solid #34383d}
    #atu-season-badges .atu-metal{display:inline-block;font:900 clamp(44px,9vw,72px)/1.12 system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:-.07em;font-style:italic;padding:0 .13em 0 .02em;color:var(--atu-metal-mid);background:linear-gradient(155deg,var(--atu-metal-deep) 4%,var(--atu-metal-mid) 27%,var(--atu-metal-light) 39%,var(--atu-metal-light) 44%,var(--atu-metal-mid) 49%,var(--atu-metal-deep) 62%,var(--atu-metal-mid) 79%,var(--atu-metal-light) 100%);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 8px var(--atu-metal-glow))}
    #atu-season-badges .atu-gold{--atu-metal-deep:#b68120;--atu-metal-mid:#f9c85b;--atu-metal-light:#fff5cd;--atu-metal-glow:#ffbf4028}
    #atu-season-badges .atu-silver{--atu-metal-deep:#788998;--atu-metal-mid:#c7d5e2;--atu-metal-light:#ffffff;--atu-metal-glow:#d4e9ff20}
    #atu-season-badges .atu-bronze{--atu-metal-deep:#9e5737;--atu-metal-mid:#db946c;--atu-metal-light:#ffe0c4;--atu-metal-glow:#e3936c20}
    #atu-season-badges .atu-champion-wrap{display:flex;justify-content:center;padding:28px 0}
    #atu-season-badges .atu-champion{display:inline-flex;gap:10px;align-items:center;padding:11px 19px;border:1px solid #ac8738;border-radius:7px;background:linear-gradient(120deg,#332918,#1f1c16);color:#ffdb85;font-size:15px;font-weight:800;letter-spacing:.12em;box-shadow:inset 0 1px 0 #ffe9a81f}
    #atu-season-badges .atu-champion svg{width:21px;height:21px;flex-shrink:0}
    #atu-season-badges .atu-tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;justify-items:center;padding:0 0 4px}
    #atu-season-badges .atu-tier{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;gap:6px;padding:8px 13px;border-radius:6px;border:1px solid;font-size:12px;font-weight:800;letter-spacing:.035em}
    #atu-season-badges .atu-ten{background:#15353c;border-color:#347989;color:#66e4ff}
    #atu-season-badges .atu-fifty{background:#202d38;border-color:#50697f;color:#bad7ef}
    #atu-season-badges .atu-hundred{background:#292c31;border-color:#575d67;color:#d0d5df}
    #atu-season-badges .atu-tier svg{width:14px;height:14px;flex-shrink:0}
    @media(max-width:400px){#atu-season-badges .atu-body{padding:24px 15px}#atu-season-badges .atu-strip{padding:11px 15px}#atu-season-badges .atu-tiers{gap:7px}#atu-season-badges .atu-tier{padding:8px;font-size:11px;gap:4px}#atu-season-badges h2{font-size:25px}}
    @media(forced-colors:active){#atu-season-badges .atu-metal{-webkit-text-fill-color:currentColor;background:none;filter:none}}
  </style>
  <div class="atu-strip"><span>Beta season</span><span>82–0 Club</span></div>
  <section class="atu-body" aria-label="Season badge preview">
    <h2>Season honours</h2>
    <div class="atu-podium" aria-label="Placement titles">
      <span class="atu-metal atu-gold" aria-label="1st, gold title">1st</span>
      <span class="atu-metal atu-silver" aria-label="2nd, silver title">2nd</span>
      <span class="atu-metal atu-bronze" aria-label="3rd, bronze title">3rd</span>
    </div>
    <div class="atu-champion-wrap"><span class="atu-champion"><i data-lucide="crown" aria-hidden="true"></i>CHAMPION</span></div>
    <div class="atu-tiers" aria-label="Placement badges">
      <span class="atu-tier atu-ten"><i data-lucide="star" aria-hidden="true"></i>TOP 10</span>
      <span class="atu-tier atu-fifty"><i data-lucide="star" aria-hidden="true"></i>TOP 50</span>
      <span class="atu-tier atu-hundred"><i data-lucide="star" aria-hidden="true"></i>TOP 100</span>
    </div>
  </section>
</div>
