<div id="atu-handle-badges">
  <style>
    #atu-handle-badges{color-scheme:dark;background:#171a1e;color:#f3f3f7;font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;border-radius:14px;max-width:620px;margin:auto;overflow:hidden}
    #atu-handle-badges *{box-sizing:border-box}
    #atu-handle-badges .atu-heading{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:15px 20px;background:#252218;border-bottom:1px solid #594b27;color:#ffc53d;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    #atu-handle-badges .atu-heading span:last-child{color:#c4b78f}
    #atu-handle-badges .atu-handles{margin:0;padding:0 20px;list-style:none}
    #atu-handle-badges .atu-row{min-height:66px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid #30353b}
    #atu-handle-badges .atu-row:last-child{border-bottom:0}
    #atu-handle-badges .atu-handle{font-size:14px;font-weight:600;white-space:nowrap;color:#f1f2f5}
    #atu-handle-badges .atu-awards{display:inline-flex;align-items:center;gap:9px;flex-shrink:0}
    #atu-handle-badges .atu-metal{display:inline-block;font:900 italic 21px/1.2 system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:-.05em;padding-right:3px;color:var(--atu-metal-mid);background:linear-gradient(155deg,var(--atu-metal-deep) 4%,var(--atu-metal-mid) 27%,var(--atu-metal-light) 39%,var(--atu-metal-light) 44%,var(--atu-metal-mid) 49%,var(--atu-metal-deep) 62%,var(--atu-metal-mid) 79%,var(--atu-metal-light) 100%);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 5px var(--atu-metal-glow))}
    #atu-handle-badges .atu-gold{--atu-metal-deep:#b68120;--atu-metal-mid:#f9c85b;--atu-metal-light:#fff5cd;--atu-metal-glow:#ffbf4028}
    #atu-handle-badges .atu-silver{--atu-metal-deep:#788998;--atu-metal-mid:#c7d5e2;--atu-metal-light:#ffffff;--atu-metal-glow:#d4e9ff20}
    #atu-handle-badges .atu-bronze{--atu-metal-deep:#9e5737;--atu-metal-mid:#db946c;--atu-metal-light:#ffe0c4;--atu-metal-glow:#e3936c20}
    #atu-handle-badges .atu-badge{display:inline-flex;gap:5px;align-items:center;white-space:nowrap;border:1px solid;border-radius:5px;padding:3px 7px;font-size:11px;line-height:16px;font-weight:800;letter-spacing:.025em}
    #atu-handle-badges .atu-badge svg{width:13px;height:13px;flex-shrink:0}
    #atu-handle-badges .atu-champion{border-color:#ac8738;background:linear-gradient(120deg,#332918,#1f1c16);color:#ffdb85;box-shadow:inset 0 1px 0 #ffe9a81f}
    #atu-handle-badges .atu-ten{background:#15353c;border-color:#347989;color:#66e4ff}
    #atu-handle-badges .atu-fifty{background:#202d38;border-color:#50697f;color:#bad7ef}
    #atu-handle-badges .atu-hundred{background:#292c31;border-color:#575d67;color:#d0d5df}
    @media(max-width:400px){#atu-handle-badges .atu-handles{padding:0 14px}#atu-handle-badges .atu-heading{padding:14px}#atu-handle-badges .atu-row,#atu-handle-badges .atu-awards{gap:7px}}
    @media(forced-colors:active){#atu-handle-badges .atu-metal{-webkit-text-fill-color:currentColor;background:none;filter:none}}
  </style>
  <div class="atu-heading"><span>82–0 Club</span><span>Beta season · Badge preview</span></div>
  <ul class="atu-handles" aria-label="Examples of season honours beside the player handle">
    <li class="atu-row"><span class="atu-handle">@judethedude</span><span class="atu-awards"><span class="atu-metal atu-gold">1st</span><span class="atu-badge atu-champion"><i data-lucide="crown" aria-hidden="true"></i>CHAMPION</span></span></li>
    <li class="atu-row"><span class="atu-handle">@judethedude</span><span class="atu-metal atu-silver">2nd</span></li>
    <li class="atu-row"><span class="atu-handle">@judethedude</span><span class="atu-metal atu-bronze">3rd</span></li>
    <li class="atu-row"><span class="atu-handle">@judethedude</span><span class="atu-badge atu-ten"><i data-lucide="star" aria-hidden="true"></i>TOP 10</span></li>
    <li class="atu-row"><span class="atu-handle">@judethedude</span><span class="atu-badge atu-fifty"><i data-lucide="star" aria-hidden="true"></i>TOP 50</span></li>
    <li class="atu-row"><span class="atu-handle">@judethedude</span><span class="atu-badge atu-hundred"><i data-lucide="star" aria-hidden="true"></i>TOP 100</span></li>
  </ul>
</div>
